<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Obrigações fiscais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F4F2;--card:#FFFFFF;--ink:#15302A;--muted:#5C6E67;--line:#D8DFDB;--tile:#E6ECE8;
  --accent:#1E5B49;--accent-ink:#FFFFFF;--on-strong:#FFFFFF;
  --late:#B3261E;--late-bg:#FBE8E6;--soon:#955C0F;--soon-bg:#FBEFD9;--done:#2C7A4C;--done-bg:#E3F1E8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1614;--card:#16211E;--ink:#E2EBE7;--muted:#93A49D;--line:#27342F;--tile:#1F2B28;
  --accent:#72C3A4;--accent-ink:#0E1614;--on-strong:#0E1614;
  --late:#F08A80;--late-bg:#3A1C1A;--soon:#E6B062;--soon-bg:#35291A;--done:#82CC9D;--done-bg:#1A3024;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0E1614;--card:#16211E;--ink:#E2EBE7;--muted:#93A49D;--line:#27342F;--tile:#1F2B28;
  --accent:#72C3A4;--accent-ink:#0E1614;--on-strong:#0E1614;
  --late:#F08A80;--late-bg:#3A1C1A;--soon:#E6B062;--soon-bg:#35291A;--done:#82CC9D;--done-bg:#1A3024;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:800;letter-spacing:.01em}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);transition:box-shadow .15s}
.top::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:calc(env(safe-area-inset-top,0px) + 60px);background:var(--paper)}
.top.scrolled{box-shadow:0 1px 0 var(--line),0 6px 16px rgba(0,0,0,.06)}
main{position:relative;z-index:1}
.top-in{max-width:880px;margin:0 auto;padding:14px 16px 8px;display:flex;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:24px;font-weight:700;margin:0;letter-spacing:-.02em}
.today{font-size:13px;color:var(--muted)}
.back{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:24px;line-height:1;flex:none;display:grid;place-items:center;padding:0 0 3px}
.back[hidden]{display:none}
.top-act{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;height:40px;padding:0 14px;font-weight:600;display:flex;align-items:center;gap:6px}


main{max-width:880px;margin:0 auto;padding:4px 16px 40px}
h2{font-size:15px;font-weight:700;margin:26px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font-size:13px;font-weight:600;color:var(--muted)}
.sub{color:var(--muted);margin:0 0 12px;max-width:60ch;font-size:14px}

/* Widgets */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:720px){.grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.w{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;aspect-ratio:1/1;min-width:0;overflow:hidden;position:relative}
@media (min-width:720px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
button.w:active{transform:scale(.98)}
.w .n{font-size:46px;line-height:.9}
.w .l{font-weight:600;font-size:14px;margin-top:6px}
.w .s{font-size:12px;color:var(--muted)}
.w.late{background:var(--late);border-color:var(--late);color:var(--on-strong)}
.w.late .s{color:inherit;opacity:.8}
.w.soon .n{color:var(--soon)}
.w.good .n{color:var(--done)}
.w .ring{position:absolute;right:12px;top:12px;width:34px;height:34px}
.w.wide{grid-column:1/-1;min-height:0}
.w.span2{grid-column:span 2}
.w.add{border-style:dashed;background:transparent;align-items:center;justify-content:center;text-align:center;color:var(--accent);font-weight:600;gap:4px}
.w.add .plus{font-size:28px;line-height:1}
.w .top2{display:flex;align-items:baseline;gap:10px}
.w .prev{font-size:13px;margin-top:10px;display:grid;gap:3px;min-width:0}
.w .prev span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w .eyebrow{font-size:13px;font-weight:600;color:var(--muted)}
.w.late .eyebrow{color:inherit;opacity:.85}
.w .wnext{display:flex;gap:12px;align-items:center;margin-top:8px;min-width:0}
.w .wnext .tile{flex:none}
.w .wnext .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w .en{font-weight:700;font-size:15px;line-height:1.25;padding-right:40px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.w.late .ring circle:first-child{stroke:rgba(255,255,255,.3)}
.w.late .ring circle:last-child{stroke:var(--on-strong)}
.grid.home{margin-top:6px}
@media (min-width:720px){.grid.home{grid-template-columns:repeat(3,minmax(0,1fr))}}
.wi{width:28px;height:28px;color:var(--accent)}
.w.late .wi{color:inherit}
.w.soon .wi{color:var(--soon)}
.w .n.sm{font-size:38px}
.set{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.set h3{margin:0 0 2px;font-size:15px}
.set p{margin:0;color:var(--muted);font-size:13px}
.set .seg{margin:12px 0 0}
.set .actions{margin:12px 0 0}
.sel{position:relative;margin:2px 0 14px}
.sel select{width:100%;appearance:none;-webkit-appearance:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 44px 12px 14px;font:inherit;font-weight:700;font-size:17px;color:var(--ink);min-height:50px}
.sel::after{content:"";position:absolute;right:18px;top:50%;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.mx{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--card);margin-top:12px}
.mx table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.mx th,.mx td{padding:6px 3px;text-align:center;border-bottom:1px solid var(--line)}
.mx tr:last-child td{border-bottom:0}
.mx th{color:var(--muted);font-weight:600}
.mx th:first-child,.mx td:first-child{position:sticky;left:0;background:var(--card);text-align:left;padding-left:12px;min-width:150px;max-width:180px;z-index:1}
.mx td:first-child button{background:none;border:0;padding:0;text-align:left;font-weight:600;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.cell{width:34px;height:30px;border-radius:8px;border:0;font-weight:700;font-size:12px;display:inline-grid;place-items:center;padding:0}
.c-feito{background:var(--done-bg);color:var(--done)}.c-atrasado{background:var(--late);color:var(--on-strong)}.c-breve{background:var(--soon-bg);color:var(--soon)}.c-na{background:var(--tile);color:var(--muted);font-size:10px}.c-futuro{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend .cell{width:22px;height:20px;font-size:11px}
.hg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
@media (min-width:560px){.hg{grid-template-columns:repeat(6,minmax(0,1fr))}}
.hc{border:0;border-radius:14px;height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700}
.hc span{font-size:12px;font-weight:600;opacity:.85}
.hc b{font-size:18px}
.vrow{display:grid;grid-template-columns:1fr 1fr 32px;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.sec{font-size:13px;font-weight:600;color:var(--muted);margin:22px 2px 8px}

.ec{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;width:100%;text-align:left;display:block}
.ec-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ec-h b{font-size:16px}
.ec-st{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pill{padding:4px 11px;border-radius:999px;font-weight:600;font-size:13px;background:var(--tile)}
.pill.late{background:var(--late-bg);color:var(--late)}
.pill.soon{background:var(--soon-bg);color:var(--soon)}
.pill.ok{background:var(--done-bg);color:var(--done)}
.ec-n{font-size:13px;color:var(--muted);margin-top:8px}
.bar{height:5px;border-radius:3px;background:var(--tile);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--done)}
.chev{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);flex:none}

.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--late)}
.chip.add{border-style:dashed}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 12px}
.head b{font-size:20px;letter-spacing:-.01em}
.head small{display:block;color:var(--muted);font-size:13px;font-weight:500}
.gear{border:1px solid var(--line);background:var(--card);border-radius:12px;height:40px;padding:0 12px;font-weight:600;display:flex;gap:6px;align-items:center;color:var(--accent)}
.seg{display:flex;background:var(--tile);border-radius:12px;padding:3px;margin:18px 0 6px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* Items */
.item{display:grid;grid-template-columns:54px 1fr 40px;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 10px 9px 9px;margin-bottom:8px;cursor:pointer;position:relative}
.tile{width:54px;height:58px;border-radius:11px;background:var(--tile);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.tile b{font-size:30px}
.tile span{font-size:11px;font-weight:600;margin-top:3px;opacity:.75}
.st-atrasado .tile{background:var(--late);color:var(--on-strong)}
.st-breve .tile{background:var(--soon-bg);color:var(--soon)}
.st-feito .tile{opacity:.5}
.st-na .tile{opacity:.35}
.tx{min-width:0}
.nm{font-weight:600;line-height:1.3}
.st-feito .nm,.st-na .nm{color:var(--muted)}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:1px}
.emp{font-weight:600;color:var(--ink)}
.cd{font-size:13px;font-weight:600;margin-top:2px}
.st-atrasado .cd{color:var(--late)} .st-breve .cd{color:var(--soon)} .st-feito .cd{color:var(--done)} .st-futuro .cd,.st-na .cd{color:var(--muted)}
.chk{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;padding:0;justify-self:end}
.chk svg{width:18px;height:18px;opacity:0}
.chk:hover svg{opacity:.35}
.st-feito .chk{background:var(--done);border-color:var(--done);color:var(--on-strong)}
.st-feito .chk svg{opacity:1}
.st-na .chk{border-style:dashed}
.stamp{position:absolute;right:58px;top:50%;transform:translateY(-50%) rotate(-7deg);border:2px solid var(--late);color:var(--late);padding:1px 8px;border-radius:5px;font-weight:700;font-size:12px;opacity:.8;pointer-events:none;background:var(--card)}
@media (max-width:560px){.stamp{display:none}}
.mh{font-size:14px;font-weight:700;margin:20px 0 6px;display:flex;justify-content:space-between}
.mh small{color:var(--muted);font-weight:600}
.yr{display:flex;align-items:center;gap:8px;margin:12px 0 0}
.yr b{font-size:22px;min-width:64px;text-align:center}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:18px}

.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left}
.row .tx{flex:1}
.row small{display:block;color:var(--muted);font-size:13px}
.row .cnt{font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.btn.ghost{background:var(--card);color:var(--accent);box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger{background:none;color:var(--late);padding-left:4px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:20px;margin-top:10px}
.empty p{margin:0 0 4px;color:var(--muted);max-width:60ch}
.empty strong{display:block;font-size:17px;margin-bottom:4px}
.foot{color:var(--muted);font-size:12px;margin-top:28px}
.loading{padding:40px 0;color:var(--muted)}

dialog{border:0;border-radius:20px;padding:0;width:min(540px,calc(100% - 24px));max-height:calc(100% - 48px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,20,17,.45)}
dialog[open]{display:flex;flex-direction:column}
.sh-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 18px 6px}
.sh-h h3{margin:0;font-size:18px;line-height:1.25}
.sh-h p{margin:3px 0 0;color:var(--muted);font-size:13px}
.x{border:0;background:var(--tile);width:32px;height:32px;border-radius:50%;flex:none;font-size:18px;line-height:1}
.sh-b{padding:4px 18px 14px;overflow:auto}
.sh-f{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:12px 18px 16px;border-top:1px solid var(--line)}
.sh-f .r{display:flex;gap:8px;margin-left:auto}
@media (max-width:640px){
  dialog{margin:auto auto 0;width:100%;max-width:100%;border-radius:20px 20px 0 0;max-height:90%}
  .sh-f{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
}
label.f{display:block;font-size:13px;font-weight:600;margin:14px 0 4px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
input[type=text],input[type=number],input[type=date],input[type=month],select.in,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit;min-height:44px}
textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ck:last-child{border-bottom:0}
.ck input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.ck small{display:block;color:var(--muted);font-size:12px}
.switch{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:14px;cursor:pointer}
.switch span{font-size:14px;font-weight:500}
.switch input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;margin:0;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(18px)}
.cat{font-size:13px;font-weight:700;margin:16px 0 2px}
.preview{background:var(--tile);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:14px}
.preview ul{margin:4px 0 0;padding-left:18px}
.statusline{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;margin-top:6px}
.s-atrasado{background:var(--late-bg);color:var(--late)} .s-breve{background:var(--soon-bg);color:var(--soon)} .s-feito{background:var(--done-bg);color:var(--done)} .s-futuro,.s-na{background:var(--tile);color:var(--muted)}
.rad{display:flex;gap:6px;margin-top:14px}
.rad label{flex:1;position:relative;border:1px solid var(--line);border-radius:10px;padding:9px 6px;text-align:center;font-weight:600;font-size:14px;cursor:pointer}
.rad input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.rad label:has(input:checked){background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rad label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}

#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px;display:flex;gap:14px;align-items:center;font-size:14px;z-index:20;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:var(--paper);font-weight:700;text-decoration:underline;padding:0}

@media (max-width:640px){
}
@media (prefers-reduced-motion:reduce){#toast,.switch input,.switch input::after{transition:none}button.w:active{transform:none}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div style="display:flex;align-items:center;gap:10px;min-width:0"><button class="back" id="back" aria-label="Voltar ao início" hidden>‹</button><div style="min-width:0"><h1 id="title">Início</h1><div class="today" id="today"></div></div></div>
    <div id="topAct"></div>
  </div>
</header>
<main id="view"><div class="loading">A carregar…</div></main>
<dialog id="sheet"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const CATS=['IVA','Retenções e salários','Segurança Social','IRC','Banco de Portugal','Outras obrigações','Fecho mensal'];
const CICLO={mensal:'Mensal',trimestral:'Trimestral',semestral:'Semestral',anual:'Anual'};
const STEP={mensal:1,trimestral:3,semestral:6,anual:12};
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
/* Lista base (Portugal): mês da 1.ª data limite relativo a janeiro do ano corrente, dia limite e ciclo. Prazos habituais, editáveis. */
const BASE=[
 ['b-iva-m-dec','IVA – declaração periódica (mensal)','IVA','mensal',3,20,2],
 ['b-iva-m-pag','IVA – pagamento (mensal)','IVA','mensal',3,25,2],
 ['b-iva-t-dec','IVA – declaração periódica (trimestral)','IVA','trimestral',5,20,2],
 ['b-iva-t-pag','IVA – pagamento (trimestral)','IVA','trimestral',5,25,2],

      for(const p of prazos(o,from,ate)){if(!emVigor(e,o.id,vigIdx(o,p.mi)))continue;const k=o.id+'|'+p.key;out.push({e,o,key:p.key,mi:p.mi,k,d:p.d,r:rec[k]||null})}
    }

}
function status(oc){if(oc.r&&oc.r.na)return'na';if(oc.r&&oc.r.feito)return'feito';const n=dias(oc.d);return n<0?'atrasado':n<=7?'breve':'futuro'}

/* Migração do modelo anterior (período + meses após) */
function migrate(){
  if(S.v===2)return false;
  const y0=Math.min(...S.empresas.map(e=>iniEmp(e).getFullYear()),new Date().getFullYear());
  const endOf=(o,k)=>{if(o.per==='trimestral'){const[y,q]=k.split('-T').map(Number);return[y,q*3]}if(o.per==='semestral'){const[y,s]=k.split('-S').map(Number);return[y,s*6]}if(o.per==='anual')return[Number(k),12];const[y,m]=k.split('-').map(Number);return[y,m]};
  const slot=(o,y,m)=>y*12+(m-1)+Number(o.off||0);
  const nw={};
  S.obrigacoes.forEach(o=>{
    if(o.ciclo){nw[o.id]={n:o,old:o};return}
    const per=o.per||'mensal',first=per==='anual'?slot(o,y0-1,12):slot(o,y0,STEP[per]);
    const n={id:o.id,nome:o.nome,cat:o.cat,ciclo:per,dia:Number(o.dia)||0,util:o.util!==false,nota:o.nota||'',datas:{}};
    const y=Math.floor(first/12),m=first%12,dim=new Date(y,m+1,0).getDate();
    n.data=iso(new Date(y,m,(!n.dia||n.dia>dim)?dim:n.dia));
    Object.entries(o.datas||{}).forEach(([k,v])=>{const[yy,mm]=endOf(o,k),mi=slot(o,yy,mm);
      if(v!==iso(nominal(n,mi))&&v!==iso(nominal({...n,util:false},mi)))n.datas[slotKey(mi)]=v});
    nw[o.id]={n,old:o};
  });
  Object.values(C).forEach(c=>{const ni={};Object.entries(c.items||{}).forEach(([k,v])=>{const[oid,pk]=k.split('|'),m=nw[oid];
    if(m&&m.old&&!m.old.ciclo){const[yy,mm]=endOf(m.old,pk);ni[oid+'|'+slotKey(slot(m.old,yy,mm))]=v}else ni[k]=v});c.items=ni});
  Object.keys(nw).forEach(id=>{if(nw[id].n)nw[id]=nw[id].n});
  S.obrigacoes=S.obrigacoes.map(o=>nw[o.id]);S.v=2;
  return true;
}

  }
  return h+`</tbody></table></div>`+legend();
}

  };
  if(id)armDelete($('#del'),async()=>{S.empresas=S.empresas.filter(x=>x.id!==id);delete C[id];saveCfg();
    try{localStorage.setItem('of_c',JSON.stringify(C))}catch(err){}
    dlg.close();render();toast('Empresa eliminada')});
}
function openBase(){
  const y=new Date().getFullYear();
  const miss=BASE.filter(b=>!S.obrigacoes.some(o=>o.id===b[0]));
  if(!miss.length){toast('Já tens todas as obrigações da lista base.');return}
  const mk=b=>{const d=new Date(y,b[4]-1,1),dim=new Date(y,b[4],0).getDate();return{id:b[0],nome:b[1],cat:b[2],ciclo:b[3],dia:b[5],ref:b[6],data:iso(new Date(y,b[4]-1,(!b[5]||b[5]>dim)?dim:b[5])),util:true,nota:'',datas:{}}};
  sheet('Lista base','Prazos habituais em Portugal. Confirma-os e ajusta depois se precisares.',
   CATS.map(c=>{const l=miss.filter(b=>b[2]===c);if(!l.length)return'';return `<div class="cat">${esc(c)}</div>`+l.map(b=>`<label class="ck"><input type="checkbox" value="${b[0]}" checked><span>${esc(b[1])}<small>${esc(regra(mk(b)))}</small></span></label>`).join('')}).join(''),
   `<div class="r"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="save">Adicionar selecionadas</button></div>`);
  $('#save').onclick=()=>{const ids=[...dlg.querySelectorAll('input:checked')].map(i=>i.value);
    miss.filter(b=>ids.includes(b[0])).forEach(b=>S.obrigacoes.push(mk(b)));saveCfg();dlg.close();render();toast(`${ids.length} obrigações adicionadas`)};
}

/* Eventos */
function act(a,e){
  const k=a.dataset.act;
  if(k==='tog'){e.stopPropagation();toggle(a.closest('.item').dataset.oc);return true}
  if(k==='tab'){ui.tab=a.dataset.t;render();scrollTo(0,0);return true}
  if(k==='abrirEmp'){ui.emp=a.dataset.id;ui.tab='emp';ui.seg='falta';render();scrollTo(0,0);return true}
  if(k==='selEmp'){ui.emp=a.dataset.id;render();return true}
  if(k==='seg'){ui.seg=a.dataset.s;render();return true}
  if(k==='ano'){ui.ano+=Number(a.dataset.d);render();return true}
  if(k==='lista'){openLista(a.dataset.l,a.dataset.e);return true}
  if(k==='mapAll'){ui.mapAll=!ui.mapAll;render();return true}
  if(k==='atribuir'){atribuir(a.dataset.id);return true}
  if(k==='vigAdd'||k==='vigDel'){const e=S.empresas.find(x=>x.id===ui.emp),o=S.obrigacoes.find(x=>x.id===ui.obr);e.vig=e.vig||{};const l=e.vig[o.id]=e.vig[o.id]||[];
    if(k==='vigAdd'){l.push({de:curMonth(),ate:null});if(!(e.obr||[]).includes(o.id))(e.obr=e.obr||[]).push(o.id)}else l.splice(Number(a.dataset.i),1);vigEdit(e,o);render();return true}
  if(k==='hist'){ui.obr=a.dataset.id;ui.from=ui.tab==='mapa'?'mapa':'porobr';ui.tab='hist';if(dlg.open)dlg.close();render();scrollTo(0,0);return true}
  if(k==='novaObr'){editObr(null);return true}
  if(k==='editObr'){editObr(a.dataset.id);return true}
  if(k==='novaEmp'){editEmp(null);return true}
  if(k==='editEmp'){editEmp(a.dataset.id);return true}
  if(k==='base'){openBase();return true}
  if(k==='cat'){openCat(a.dataset.c);return true}
  if(k==='def'){S.def={...(S.def||{}),[a.dataset.k]:a.dataset.k==='janela'?Number(a.dataset.v):a.dataset.v};saveCfg();applyTheme();render();return true}
  if(k==='exp'){exportar();return true}
  if(k==='imp'){const f=$('#impFile');f.value='';f.onchange=()=>{if(f.files[0])importar(f.files[0])};f.click();return true}
  if(k==='oc'){openOc(a.dataset.id);return true}
}
$('#back').addEventListener('click',()=>{ui.tab=ui.tab==='hist'?(ui.from||'porobr'):(ui.tab==='mapa'||ui.tab==='porobr')?'emp':'home';render();scrollTo(0,0)});
$('#view').addEventListener('change',ev=>{if(ev.target.id==='empPick'){ui.emp=ev.target.value;render();return}
  const t=ev.target.closest('[data-vig]');if(t&&ui.tab==='hist'){const e=S.empresas.find(x=>x.id===ui.emp),o=S.obrigacoes.find(x=>x.id===ui.obr),v=vigs(e,o.id)[Number(t.dataset.i)];
    if(!v)return;if(t.dataset.vig==='de'){if(!t.value){toast('Indica o mês de início.');render();return}v.de=t.value}else v.ate=t.value||null;
    if(v.ate&&kidx(v.ate)<kidx(v.de)){toast('"Até" não pode ser anterior a "Desde".');v.ate=null}
    vigEdit(e,o);render();}});
$('#topAct').addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a)act(a,e)});
function onClick(e){const a=e.target.closest('[data-act]');if(a&&act(a,e))return;const it=e.target.closest('.item');if(it)openOc(it.dataset.oc)}
$('#view').addEventListener('click',onClick);
dlg.addEventListener('click',e=>{if(e.target.closest('.sh-b [data-act], .sh-b .item'))onClick(e)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('item')){e.preventDefault();openOc(e.target.dataset.oc)}});
function toast(msg,undo){const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button>Anular</button>':''}`;t.classList.add('on');
  if(undo)t.querySelector('button').onclick=()=>{undo();t.classList.remove('on')};clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),4500)}

async function init(){
  render();
  try{const a=JSON.parse(localStorage.getItem('of_cfg')||'null');if(a){S={v:a.v||1,...a};C=JSON.parse(localStorage.getItem('of_c')||'{}')||{}}else{S=clone(SEED.S);C=clone(SEED.C);localStorage.setItem('of_cfg',JSON.stringify(S));localStorage.setItem('of_c',JSON.stringify(C))}}
  catch(e){S=clone(SEED.S);C=clone(SEED.C);toast('Este navegador não permite guardar dados. Exporta uma cópia antes de fechar.')}
  S.empresas.forEach(e=>{C[e.id]=C[e.id]||{items:{}};C[e.id].items=C[e.id].items||{}});
  if(!S.obrigacoes.length&&!S.empresas.length)S.v=2;
  let ch=migrate();
  S.obrigacoes.forEach(o=>{if(o.ref===undefined){o.ref=o.ciclo==='anual'?0:o.ciclo==='mensal'?1:2;ch=true}});
  S.empresas.forEach(e=>{if(!e.vig){e.vig={};(e.obr||[]).forEach(id=>e.vig[id]=[{de:e.inicio||curMonth(),ate:null}]);ch=true}});
  if(ch){saveCfg();S.empresas.forEach(e=>saveC(e.id))}
  applyTheme();ready=true;render();
}
addEventListener('scroll',()=>$('.top').classList.toggle('scrolled',scrollY>4),{passive:true});
init();
</script>
