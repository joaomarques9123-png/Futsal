<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#006633">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Futebol Stats">
<title>Futebol — Stats</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#006633;--g2:#007a3d;--gold:#c8a84b;--bg:#f4f6f2;--s:#fff;--s2:#eef2ec;--b:rgba(0,102,51,.12);--b2:rgba(0,102,51,.22);--t:#0d1f0d;--m:#5a7060;--d:#8aa890;--red:#c0392b;--amb:#c8a84b;--blue:#4a7fb5;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);font-family:'Barlow',sans-serif;font-size:14px;min-height:100vh}
.cond{font-family:'Barlow Condensed',sans-serif}
.page{display:none;padding:14px 14px 30px}.page.on{display:block}
#bar{display:none;align-items:center;gap:10px;padding:0 14px;padding-top:env(safe-area-inset-top,0);min-height:calc(50px + env(safe-area-inset-top,0));background:var(--g);position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,80,30,.18)}
#bar button{background:rgba(255,255,255,.15);border:none;color:#fff;width:32px;height:32px;border-radius:50%;font-size:17px;cursor:pointer}
#bar-t{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:800;color:#fff}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0)) 2px 2px}
.top h1{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:900}
.upd{font-size:11px;color:var(--d);margin:0 2px 12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}}
.tile{background:var(--s);border:1px solid var(--b2);border-radius:14px;padding:13px;min-height:76px;cursor:pointer;min-width:0}
.tile:active{transform:scale(.98)}
.tile .ic{font-size:20px}.tile .lb{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;margin-top:6px}
.wt{display:flex;align-items:center;gap:6px;margin-bottom:7px}.wt span:last-child{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--s);border:1px solid var(--b);border-radius:var(--r);min-width:0}
.sel,.btn{padding:6px 9px;border:1px solid var(--b2);border-radius:8px;background:var(--s2);font-family:'Barlow',sans-serif;font-size:12px;color:var(--t);min-width:0}
.btn{background:var(--s);font-weight:700;color:var(--m);cursor:pointer;white-space:nowrap}
.btn.on{background:var(--g);border-color:var(--g);color:#fff}
.row{display:flex;align-items:center;gap:6px;margin-bottom:8px}.grow{flex:1}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-size:10px;font-weight:700;color:var(--d);padding:8px 4px;border-bottom:2px solid var(--g);text-align:center;white-space:nowrap}
table.t td{padding:8px 4px;border-bottom:1px solid var(--b);text-align:center;white-space:nowrap}
table.t td.n,table.t th.n{text-align:left;font-weight:600}
table.t tr.cl{cursor:pointer}table.t tr.cl td.n{color:var(--g)}
.tag{display:inline-block;padding:2px 7px;border-radius:99px;font-size:11px;font-weight:700}
.tg{background:rgba(0,102,51,.1);color:var(--g)}.tr{background:rgba(192,57,43,.1);color:var(--red)}
.up{color:var(--g);font-weight:700;font-size:11px}.dn{color:var(--red);font-weight:700;font-size:11px}.dim{color:var(--d)}
.sec{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--g);margin:18px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--b2)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sc{background:var(--s2);border:1px solid var(--b);border-radius:10px;padding:10px}
.sc .l{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--d)}
.sc .v{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;line-height:1.1}
.sc .s{font-size:10px;color:var(--d)}
.li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--b);font-size:13px}
.li:last-child{border-bottom:none}.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.li .v{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:800}.li .s{font-size:11px;color:var(--m);white-space:nowrap}
.rk{width:24px;text-align:center;font-weight:700;color:var(--d)}
.bar{margin-bottom:10px}.bar .h{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}.bar .tk{height:6px;background:var(--s2);border-radius:99px;overflow:hidden}.bar .f{height:100%;border-radius:99px}
.mh{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;color:var(--g);text-transform:uppercase;letter-spacing:.07em;margin:14px 2px 6px}
.gr{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--b);cursor:pointer}.gr:last-child{border-bottom:none}
.gr .id{font-size:11px;color:var(--d);width:34px}.gr .dt{flex:1;font-size:13px}.gr b{font-family:'Barlow Condensed',sans-serif;font-size:18px}
.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--b2);background:var(--s);font-size:12px;font-weight:600;color:var(--m);cursor:pointer}.chip.on{background:var(--g);border-color:var(--g);color:#fff}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100}
#md{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,94vw);max-height:88vh;overflow-y:auto;background:var(--s);border-radius:14px;z-index:101;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.mhd{background:var(--g);color:#fff;padding:14px 16px;border-radius:14px 14px 0 0;display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;z-index:2}
.mhd .tt{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800}
.mhd button{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:50%;width:30px;height:30px;font-size:18px;cursor:pointer;flex-shrink:0}
.mb{padding:12px 16px 18px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tab{padding:4px 10px;border-radius:99px;border:1px solid var(--b2);background:none;font-size:12px;font-weight:600;color:var(--m);cursor:pointer}.tab.on{background:var(--g);border-color:var(--g);color:#fff}
.gd-s{font-family:'Barlow Condensed',sans-serif;font-size:40px;font-weight:900;text-align:center;line-height:1}
.tm{display:grid;grid-template-columns:minmax(0,1fr) 30px 30px;gap:2px;align-items:center;padding:7px 0;border-bottom:1px solid var(--b);font-size:13px}
.tm span{text-align:center}.tm .n{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--g);cursor:pointer}.tm.h{font-size:10px;font-weight:700;color:var(--d);border-bottom:2px solid var(--b2)}.tm.h .n{color:var(--m);cursor:default}
.tl-h{display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;text-transform:uppercase;color:var(--m);margin-bottom:6px}
.tl{position:relative}.tl::before{content:'';position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--b2)}
.tl-r{display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;min-height:40px;padding:3px 0;position:relative}
.tl-m{display:flex;flex-direction:column;align-items:center;z-index:1}.tl-m .mn{background:var(--g);color:#fff;border-radius:99px;padding:1px 8px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800}.tl-m .scr{background:var(--s);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:800;padding:0 3px}
.gm{display:grid;grid-template-columns:62px 1fr 30px;align-items:center;gap:8px;padding:4px 0;font-size:12px}.gm .tk{height:14px;background:var(--s2);border-radius:99px;overflow:hidden}.gm .f{height:100%;background:var(--g);border-radius:99px}.gm .f.top{background:var(--gold)}
.ps-head{background:var(--g);color:#fff;border-radius:var(--r);padding:12px 14px}.ps-head .nm{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900}.ps-head .sb{font-size:12px;opacity:.85}
.pill{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:5px;font-size:10px;font-weight:800;margin-right:2px}.pill.w{background:rgba(0,102,51,.12);color:var(--g)}.pill.l{background:rgba(192,57,43,.1);color:var(--red)}
.m12{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;flex:1}.mc{font-size:9px;text-align:center;padding:4px 0;border-radius:4px;background:var(--s2);font-weight:700}
.mc.hi{background:rgba(0,102,51,.15);color:var(--g)}.mc.md{background:rgba(200,168,75,.18);color:#8a6d00}.mc.lo{background:rgba(192,57,43,.12);color:var(--red)}
.ax{display:grid;grid-template-columns:1fr auto;font-size:12px;padding:3px 0;position:relative}.ax i{position:absolute;left:0;bottom:0;height:2px;background:var(--g)}
.tgl{width:100%;margin-top:14px;display:flex;justify-content:space-between;padding:10px 12px;border:1px solid var(--b2);border-radius:var(--r);background:var(--s);font-size:13px;font-weight:700;color:var(--g);cursor:pointer}
.empty{padding:16px;color:var(--d);font-style:italic;font-size:13px;text-align:center}
</style>
</head>
<body>

<div id="bar"><button onclick="back()" aria-label="Back">←</button><button onclick="home()" aria-label="Home">🏠</button><div id="bar-t"></div></div>

<div id="p-home" class="page on">
  <div class="top"><h1>FUTEBOL</h1><select id="year" class="sel cond" style="font-size:18px;font-weight:900;color:var(--gold)" onchange="setYear(this.value)"></select></div>
  <div class="upd" id="upd">Loading…</div>
  <div class="grid">
    <div class="tile" id="w-rank" onclick="go('rank')"></div>
    <div class="tile" id="w-goals" onclick="go('goals')"></div>
    <div class="tile" id="w-form" onclick="go('form')"></div>
    <div class="tile" onclick="go('games')"><div class="ic">📋</div><div class="lb">Games</div></div>
    <div class="tile" onclick="go('records')"><div class="ic">📊</div><div class="lb">Records</div></div>
    <div class="tile" onclick="go('player')"><div class="ic">👤</div><div class="lb">Player Stats</div></div>
    <div class="tile" onclick="go('duos')"><div class="ic">🤝</div><div class="lb">Duos</div></div>
    <div class="tile" onclick="go('minutes')"><div class="ic">⏱</div><div class="lb">Goal Minutes</div></div>
  </div>
</div>

<div id="p-rank" class="page">
  <div class="row"><button class="btn" onclick="rkStep(-1)">◀</button><select id="rk-game" class="sel grow" onchange="rkGame=this.value==='all'?'all':+this.value;renderRank()"></select><button class="btn" onclick="rkStep(1)">▶</button></div>
  <div class="row"><select id="rk-month" class="sel grow" onchange="rkMonth=this.value==='all'?'all':+this.value;rkGame='all';renderRank()"></select><button class="btn" id="rk-el" onclick="rkElig=!rkElig;renderRank()"></button><button class="btn" onclick="champions()">🏆 Champions</button></div>
  <div class="card" style="padding:6px;overflow-x:auto"><table class="t"><thead><tr><th>#</th><th title="Change vs previous game">±</th><th class="n">Player</th><th>G</th><th>Adj%</th><th>Streak</th><th>W</th><th>L</th></tr></thead><tbody id="rk-body"></tbody></table></div>
</div>

<div id="p-goals" class="page">
  <div class="row"><select id="gs-sort" class="sel grow" onchange="renderGoals()"></select><button class="btn" id="gs-el" onclick="gsElig=!gsElig;renderGoals()"></button></div>
  <div class="card" style="padding:6px;overflow-x:auto"><table class="t"><thead id="gs-head"></thead><tbody id="gs-body"></tbody></table></div>
  <div class="upd" style="margin-top:8px">Filmed games only</div>
</div>

<div id="p-form" class="page"><div class="grid" id="form-grid"></div></div>

<div id="p-games" class="page">
  <div class="row"><button class="chip" id="gf-all" onclick="gFilm=false;renderGames()">All</button><button class="chip" id="gf-film" onclick="gFilm=true;renderGames()">🎥 Filmed</button><select id="g-player" class="sel grow" onchange="renderGames()"></select></div>
  <div id="g-list"></div>
</div>

<div id="p-records" class="page">
  <div class="row"><select id="rec-month" class="sel grow" onchange="renderRecords()"></select></div>
  <div class="grid" id="rec-grid"></div>
</div>

<div id="p-player" class="page">
  <div class="row"><select id="ps-sel" class="sel grow" onchange="psName=this.value;renderPlayer()"></select><button class="btn" id="ps-el" onclick="psElig=!psElig;renderPlayer()"></button></div>
  <div id="ps-body"></div>
</div>

<div id="p-duos" class="page">
  <div class="grid">
    <div class="tile" onclick="go('duox')"><div class="ic">🤝</div><div class="lb">Duo explorer</div></div>
    <div class="tile" onclick="go('duoi')"><div class="ic">💡</div><div class="lb">Duo insights</div></div>
  </div>
</div>

<div id="p-duox" class="page">
  <div class="row"><select id="dx-a" class="sel grow" onchange="renderDuoX()"></select><select id="dx-b" class="sel grow" onchange="renderDuoX()"></select></div>
  <div class="row"><span style="font-size:12px;color:var(--m)">Min. games</span><input id="dx-min" type="number" min="1" value="3" class="sel" style="width:56px;text-align:center" onchange="renderDuoX()"></div>
  <div id="dx-body"></div>
</div>

<div id="p-duoi" class="page">
  <div class="row"><span style="font-size:12px;color:var(--m)">Min. games together/against</span><input id="di-min" type="number" min="1" value="5" class="sel" style="width:56px;text-align:center" onchange="renderDuoI()"></div>
  <div id="di-body"></div>
</div>

<div id="p-minutes" class="page">
  <div id="mn-all"></div>
  <div class="row" style="margin-top:12px"><select id="mn-sel" class="sel grow" onchange="renderMinutes()"></select><button class="btn" id="mn-el" onclick="mnElig=!mnElig;renderMinutes()"></button></div>
  <div id="mn-player"></div>
</div>

<div id="ov" onclick="closeM()"></div>
<div id="md"></div>

<script>
'use strict';
// ════════════════════════════════════════════════════════════
// DATA — read-only, loaded from data.json (exported from the main app)
// ════════════════════════════════════════════════════════════
let ALL = [], ROWS = [], DEFS = [], ELIG = 30, YEAR = new Date().getFullYear();
let G = [];                  // games of the selected year, chronological
const BY = {};               // gameId -> stat rows
const DEFAULT_DEFS = [
  {key:'goals',icon:'⚽',name:'Goals',enabled:true},{key:'assists',icon:'🎯',name:'Assists',enabled:true},
  {key:'ownGoals',icon:'⭕',name:'Own Goals',enabled:true},{key:'recoveries',icon:'🛡️',name:'Ball Recoveries',enabled:true}];
const MN = ['January','February','March','April','May','June','July','August','September','October','November','December'];

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const real = p => p && !p.startsWith('Outro');
const num = id => parseInt(id,10) || 0;
const adj = (w,g) => g ? Math.round((w+10)/(g+20)*100) : 0;
const pct = (w,g) => g ? Math.round(w/g*100) : 0;
const minFor = n => Math.ceil(n * ELIG / 100);
const medal = r => r===1?'🏆':r===2?'🥈':r===3?'🥉':r;
const col = v => v>=60?'var(--g)':v>=45?'var(--amb)':'var(--red)';
const won = (g,p) => (g.teamA.includes(p) && g.winner==='A') || (g.teamB.includes(p) && g.winner==='B');
const plays = (g,p) => g.teamA.includes(p) || g.teamB.includes(p);
const defs = () => DEFS.filter(d => d.enabled);
const def = k => DEFS.find(d => d.key===k) || {key:k,icon:'•',name:k};
const fmtMin = t => (Math.floor(t/60)+1) + "'";
function ranks(list, same) { const r=[]; list.forEach((x,i)=>r.push(i>0&&same(list[i-1],x)?r[i-1]:i+1)); return r; }
function rowsOf(g) { return BY[g.id] || []; }
function filmed(g) { return rowsOf(g).length > 0; }
function score(g) {
  let A=0,B=0; rowsOf(g).forEach(r => { if (g.teamA.includes(r.player)) { A+=r.goals||0; B+=r.ownGoals||0; } else if (g.teamB.includes(r.player)) { B+=r.goals||0; A+=r.ownGoals||0; } });
  return {A,B};
}
function playerGames(games) {   // name -> {g,w,res[]}
  const m = {};
  games.forEach(g => [...g.teamA,...g.teamB].filter(real).forEach(p => { (m[p]=m[p]||{g:0,w:0,res:[]}); m[p].g++; const w=won(g,p); if(w) m[p].w++; m[p].res.push(w); }));
  return m;
}
function streakOf(res) { if(!res.length) return ''; const l=res[res.length-1]; let c=0; for(let i=res.length-1;i>=0&&res[i]===l;i--) c++; return (l?'W':'L')+c; }
function maxRun(res, v) { let m=0,c=0; res.forEach(x=>{c=x===v?c+1:0;m=Math.max(m,c);}); return m; }

async function load() {
  try {
    const r = await fetch('data.json?v=' + Date.now(), {cache:'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    ALL = (d.GAMES_ALL_YEARS || []).slice();
    ROWS = (d.GOAL_STATS || []).slice();
    DEFS = Array.isArray(d.STAT_DEFS) && d.STAT_DEFS.length ? d.STAT_DEFS : DEFAULT_DEFS;
    ELIG = d.ELIGIBILITY_PCT || 30;
    ROWS.forEach(r => (BY[r.gameId] = BY[r.gameId] || []).push(r));
    const years = [...new Set(ALL.map(g => g.year))].sort((a,b)=>b-a);
    YEAR = years.includes(d.SELECTED_YEAR) ? d.SELECTED_YEAR : (years[0] || YEAR);
    document.getElementById('year').innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join('');
    document.getElementById('upd').textContent = d.exportedAt ? 'Updated ' + new Date(d.exportedAt).toLocaleDateString('pt-PT') : '';
    setYear(YEAR);
  } catch (e) {
    document.getElementById('upd').innerHTML = '<span style="color:var(--red)">Could not load data.json (' + esc(e.message) + ')</span>';
  }
}
function setYear(y) {
  YEAR = +y; document.getElementById('year').value = YEAR;
  G = ALL.filter(g => g.year === YEAR).sort((a,b) => num(a.id)-num(b.id));
  rkGame = 'all'; rkMonth = 'all';
  renderHome(); const cur = stack[stack.length-1]; if (cur !== 'home') go(cur, true);
}

// ════════════════════════════════════════════════════════════
// NAVIGATION + MODAL
// ════════════════════════════════════════════════════════════
const TITLES = {rank:'Player Ranking',goals:'Goals & Assists',form:'Current Form',games:'Games',records:'Records',player:'Player Stats',duos:'Duos',duox:'Duo Explorer',duoi:'Duo Insights',minutes:'Goal Minutes'};
const RENDER = {rank:()=>renderRank(),goals:()=>renderGoals(),form:()=>renderForm(),games:()=>renderGames(),records:()=>renderRecords(),player:()=>renderPlayer(),duox:()=>renderDuoX(),duoi:()=>renderDuoI(),minutes:()=>renderMinutes()};
let stack = ['home'];
function show(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('on'));
  document.getElementById('p-'+id).classList.add('on');
  document.getElementById('bar').style.display = id==='home' ? 'none' : 'flex';
  document.getElementById('bar-t').textContent = TITLES[id] || '';
  if (RENDER[id]) RENDER[id]();
  window.scrollTo(0,0);
}
function go(id, replace) { if (!replace && stack[stack.length-1] !== id) stack.push(id); show(id); }
function back() { stack.pop(); if (!stack.length) stack=['home']; show(stack[stack.length-1]); }
function home() { stack=['home']; show('home'); }
function modal(title, body) {
  document.getElementById('md').innerHTML = `<div class="mhd"><div class="tt">${title}</div><button onclick="closeM()" aria-label="Close">×</button></div><div class="mb">${body}</div>`;
  document.getElementById('ov').style.display = document.getElementById('md').style.display = 'block';
  document.getElementById('md').scrollTop = 0; document.body.style.overflow = 'hidden';
}
function closeM() { document.getElementById('ov').style.display = document.getElementById('md').style.display = 'none'; document.body.style.overflow = ''; }
function openPlayer(n) { closeM(); psName = n; go('player'); }
const plink = n => real(n) ? `<span style="color:var(--g);cursor:pointer" data-p="${esc(n)}" onclick="openPlayer(this.dataset.p)">${esc(n)}</span>` : esc(n);
function tabsHtml(id, labels, bodies) {
  return `<div class="tabs">${labels.map((l,i)=>`<button class="tab ${i?'':'on'}" onclick="tabTo('${id}',${i},${labels.length})" id="${id}-t${i}">${l}</button>`).join('')}</div>`

function eligToggleHtml() { return `<div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="btn" onclick="this.classList.toggle('on');eligFilter(this.classList.contains('on'))">${ELIG}%+ games</button></div>`; }

function renderHome() {

  const ts = el.sort((a,b)=>b[1].goals-a[1].goals)[0], ta = [...el].sort((a,b)=>b[1].assists-a[1].assists)[0];

}
function statTotals(games) {
  const ids = new Set(games.map(g => g.id)), t = {};
  ROWS.forEach(r => { if (!ids.has(r.gameId) || !real(r.player)) return; const x = t[r.player] = t[r.player] || {games:0}; x.games++; DEFS.forEach(d => x[d.key] = (x[d.key]||0) + (r[d.key]||0)); });
  return t;
}
function activePlayers() {
  const ms = [...new Set(G.map(g => g.month))].sort((a,b)=>a-b).slice(-2);
  return new Set(G.filter(g => ms.includes(g.month)).flatMap(g => [...g.teamA,...g.teamB]).filter(real));
}

// PLAYER RANKING — by game ("jornada"), with change vs previous game
// ════════════════════════════════════════════════════════════
let rkGame = 'all', rkMonth = 'all', rkElig = false;
function rankingTable(games, onlyElig) {
  const pg = playerGames(games), mn = onlyElig ? minFor(games.length) : 0;
  const list = Object.entries(pg).filter(([,v]) => v.g >= mn).map(([n,v]) => ({name:n, games:v.g, w:v.w, l:v.g-v.w, adj:adj(v.w,v.g), streak:streakOf(v.res)}));
  list.sort((a,b) => b.adj-a.adj || b.games-a.games);
  const r = ranks(list, (a,b) => a.adj===b.adj); list.forEach((p,i) => p.rank = r[i]);
  return list;
}
function rkStep(d) { const n = G.length; if (!n) return; let c = rkGame==='all' ? n : rkGame; c = Math.min(n, Math.max(1, c+d)); rkGame = c===n ? 'all' : c; renderRank(); }
function renderRank() {
  const gs = document.getElementById('rk-game'), ms = document.getElementById('rk-month');
  gs.innerHTML = '<option value="all">Latest game</option>' + G.map((g,i) => `<option value="${i+1}">After game ${i+1} · ${esc(g.date)}</option>`).join('');
  gs.value = String(rkGame);
  const months = [...new Set(G.map(g => g.month))].sort((a,b)=>a-b);
  ms.innerHTML = '<option value="all">All months</option>' + months.map(m => `<option value="${m}">Up to ${MN[m-1]}</option>`).join('');
  ms.value = rkGame==='all' ? String(rkMonth) : 'all';
  const b = document.getElementById('rk-el'); b.textContent = ELIG+'%+'; b.classList.toggle('on', rkElig);
  const games = rkGame!=='all' ? G.slice(0, rkGame) : (rkMonth==='all' ? G : G.filter(g => g.month <= rkMonth));
  const body = document.getElementById('rk-body');
  if (!games.length) { body.innerHTML = '<tr><td colspan="8" class="empty">No games</td></tr>'; return; }
  const cur = rankingTable(games, rkElig), prevG = games.slice(0,-1), prev = {};
  if (prevG.length) rankingTable(prevG, rkElig).forEach(p => prev[p.name] = p.rank);
  body.innerHTML = cur.map(p => {
    let d = '';
    if (prevG.length) { const pr = prev[p.name]; d = pr==null ? '<span class="tag" style="color:var(--amb);font-size:9px">NEW</span>' : pr>p.rank ? `<span class="up">▲${pr-p.rank}</span>` : pr<p.rank ? `<span class="dn">▼${p.rank-pr}</span>` : '<span class="dim">=</span>'; }
    return `<tr class="cl" data-p="${esc(p.name)}" onclick="openPlayer(this.dataset.p)"><td style="font-weight:700;color:var(--d)">${medal(p.rank)}</td><td>${d}</td><td class="n">${esc(p.name)}</td><td>${p.games}</td><td style="font-weight:700;color:${col(p.adj)}">${p.adj}%</td><td>${p.streak?`<span class="tag ${p.streak[0]==='W'?'tg':'tr'}">${p.streak}</span>`:'—'}</td><td style="color:var(--g);font-weight:600">${p.w}</td><td style="color:var(--red);font-weight:600">${p.l}</td></tr>`;
  }).join('') || '<tr><td colspan="8" class="empty">No players match the filter</td></tr>';
}
function seasonRanking(y) { const gs = ALL.filter(g => g.year===y); return { total:gs.length, min:minFor(gs.length), all:playerGames(gs), elig:rankingTable(gs, true) }; }
function champions() {
  const years = [...new Set(ALL.map(g => g.year))].sort((a,b)=>b-a), now = new Date().getFullYear();
  modal('🏆 Champions history', years.map(y => {

function renderForm() {
  const act = activePlayers(), pg = playerGames(G);
  const lists = [];
  const cur = Object.entries(pg).filter(([n]) => act.has(n)).map(([n,v]) => ({n, s:streakOf(v.res)}));
  lists.push(['🔥','Current winning streaks', cur.filter(x=>x.s[0]==='W').map(x=>[x.n,+x.s.slice(1)]), v=>v+' in a row']);
  lists.push(['❄️','Current losing streaks', cur.filter(x=>x.s[0]==='L').map(x=>[x.n,+x.s.slice(1)]), v=>v+' in a row']);
  const last5 = G.slice(-5), f5 = Object.keys(pg).filter(n=>act.has(n)).map(n => { const gs = last5.filter(g=>plays(g,n)); const w = gs.filter(g=>won(g,n)).length; return {n, p:gs.length, w}; }).filter(x=>x.p>=3);
  lists.push(['🌡️','Hottest form — last 5 games', f5.map(x=>[x.n, x.w/x.p, `${x.w}W ${x.p-x.w}L`]), (v,x)=>x]);
  lists.push(['🧊','Coldest form — last 5 games', f5.map(x=>[x.n, 1-x.w/x.p, `${x.w}W ${x.p-x.w}L`]), (v,x)=>x]);
  const att = Object.keys(pg).filter(n=>act.has(n)).map(n => { let c=0; for (let i=G.length-1;i>=0&&plays(G[i],n);i--) c++; return [n,c]; }).filter(x=>x[1]>0);
  lists.push(['📅','Consecutive games attended', att, v=>v+' games']);
  // scoring streaks over filmed games
  const fg = G.filter(filmed), sc = {};
  fg.forEach(g => rowsOf(g).filter(r=>real(r.player)).forEach(r => (sc[r.player]=sc[r.player]||[]).push(r)));
  const run = (arr, test) => { let c=0; for (let i=arr.length-1;i>=0&&test(arr[i]);i--) c++; return c; };
  lists.push(['⚽','Scoring in consecutive filmed games', Object.entries(sc).filter(([n])=>act.has(n)).map(([n,a])=>[n,run(a,r=>(r.goals||0)>0)]).filter(x=>x[1]>0), v=>v+' games']);
  lists.push(['🥶','Games without scoring (filmed)', Object.entries(sc).filter(([n])=>act.has(n)).map(([n,a])=>[n,run(a,r=>!(r.goals||0))]).filter(x=>x[1]>0), v=>v+' games']);
  lists.push(['🎯','G+A in consecutive filmed games', Object.entries(sc).filter(([n])=>act.has(n)).map(([n,a])=>[n,run(a,r=>(r.goals||0)+(r.assists||0)>0)]).filter(x=>x[1]>0), v=>v+' games']);
  window._form = lists;
  document.getElementById('form-grid').innerHTML = lists.map(([ic,t,arr,fmt],i) => {
    const s = [...arr].sort((a,b)=>b[1]-a[1]);
    return `<div class="tile" onclick="formModal(${i})"><div class="wt"><span>${ic}</span><span>${t}</span></div>${s[0]?`<div style="display:flex;justify-content:space-between;gap:6px"><b style="font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s[0][0])}</b><b class="cond" style="font-size:17px;color:var(--g)">${fmt(s[0][1],s[0][2])}</b></div>`:'<div class="dim" style="font-size:12px">None</div>'}</div>`;
  }).join('');
}
function formModal(i) {

function gameDetail(id) {

function allStats(id) {

function timeline(id) {

  const team = p => g.teamA.includes(p) ? 'A' : 'B';

    let side = team(e.player); if (e.key==='ownGoals') side = side==='A'?'B':'A'; side==='A'?a++:b++;

    return `<div class="tl-r">${cell('A')}<div class="tl-m"><span class="mn">${typeof e.t==='number'?fmtMin(e.t):'–'}</span><span class="scr">${a}–${b}</span></div>${cell('B')}</div>`;

}

const glance = (n, v) => n ? `<div style="display:flex;justify-content:space-between;gap:6px"><b style="font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n)}</b><b class="cond" style="font-size:17px;color:var(--g)">${v}</b></div>` : '';
function buildRecords(games) {
  const cats = [], pg = playerGames(games), total = games.length;
  const ids = new Set(games.map(g=>g.id)), rows = ROWS.filter(r => ids.has(r.gameId) && real(r.player));
  const fg = games.filter(filmed);
  // Season overview

  const best = [...T].sort((x,y)=>pct(y.w,y.g)-pct(x.w,x.g)||y.g-x.g).slice(0,5), worst = [...T].sort((x,y)=>pct(x.w,x.g)-pct(y.w,y.g)||y.g-x.g).slice(0,5);
  const insep = Object.values(tog).sort((x,y)=>y.g-x.g).slice(0,5), riv = Object.values(vs).filter(d=>d.a<d.b).sort((x,y)=>y.g-x.g).slice(0,5);
  const nem = Object.values(vs).filter(d=>d.g>=mn && d.w>d.g-d.w).sort((x,y)=>pct(y.w,y.g)-pct(x.w,x.g)||y.g-x.g).slice(0,5);
  const minP = Math.max(mn, minFor(G.length));
  const charm = Object.keys(pl).filter(p=>pl[p].g>=minP).map(p => { let s=0,wt=0; Object.keys(pl).forEach(t => { if (t===p) return; const w = tog[[p,t].sort().join('|')]; if (!w||w.g<3) return;
      const wo = pl[t].games.filter(g => !((g.teamA.includes(p)&&g.teamA.includes(t))||(g.teamB.includes(p)&&g.teamB.includes(t)))); if (wo.length<3) return;
      s += (w.w/w.g - wo.filter(g=>won(g,t)).length/wo.length)*w.g; wt += w.g; }); return {p, d: wt?Math.round(s/wt*100):null}; }).filter(x=>x.d!=null).sort((x,y)=>y.d-x.d).slice(0,5);
  const reg = Object.keys(pl).filter(p=>pl[p].g>=minP).sort(), never = [];
  for (let i=0;i<reg.length;i++) for (let j=i+1;j<reg.length;j++) if (!tog[[reg[i],reg[j]].sort().join('|')]) never.push(esc(reg[i])+' &amp; '+esc(reg[j]));
  document.getElementById('di-body').innerHTML =
    card('🔥 Best duos',`Highest win % together · ≥${mn} games`, best.map(d=>li(esc(d.a)+' &amp; '+esc(d.b), pct(d.w,d.g)+'%', `${d.w}W ${d.g-d.w}L`)).join(''))
    + card('🥶 Worst duos',`Lowest win % together · ≥${mn} games`, worst.map(d=>li(esc(d.a)+' &amp; '+esc(d.b), pct(d.w,d.g)+'%', `${d.w}W ${d.g-d.w}L`)).join(''))
    + card('👯 Inseparable','Most games on the same team', insep.map(d=>li(esc(d.a)+' &amp; '+esc(d.b), d.g, pct(d.w,d.g)+'% wins')).join(''))
    + card('⚔️ Biggest rivalries','Most games against each other', riv.map(d=>li(esc(d.a)+' vs '+esc(d.b), d.g, `${d.w}–${d.g-d.w}`)).join(''))
    + card('😈 Nemesis',`Who beats a specific opponent the most · ≥${mn} games`, nem.map(d=>li(`${esc(d.a)} <span class="dim" style="font-weight:400">over</span> ${esc(d.b)}`, d.w+'–'+(d.g-d.w), pct(d.w,d.g)+'%')).join(''))
    + card('🍀 Lucky charm',`Teammates win more with him than without · ≥${minP} games`, charm.map(c=>li(esc(c.p),(c.d>0?'+':'')+c.d+' pp')).join(''))
    + card('🚫 Never together',`Regular players (≥${minP} games) who never played on the same team`, never.slice(0,12).map(x=>li(x,'')).join('') + (never.length>12?`<div class="dim" style="font-size:10px">+${never.length-12} more</div>`:''));
}

// ════════════════════════════════════════════════════════════
// GOAL MINUTES — 15-minute blocks, overall and per player
// ════════════════════════════════════════════════════════════
let mnElig = false;
function blocks(goals) {
  if (!goals.length) return '<div class="dim" style="font-size:12px;margin:6px 0">No goals with minutes yet</div>';
  const maxM = Math.max(...goals.map(e=>Math.floor(e.t/60)+1)), nb = Math.max(4, Math.ceil(maxM/15)), c = Array(nb).fill(0);
  goals.forEach(e => c[Math.min(nb-1, Math.floor(Math.floor(e.t/60)/15))]++);
  const top = Math.max(...c), uniq = c.filter(x=>x===top).length===1;
  return c.map((v,i) => `<div class="gm"><span>${i*15+1}'–${(i+1)*15}'</span><div class="tk"><div class="f ${uniq&&v===top&&v>0?'top':''}" style="width:${top?Math.round(v/top*100):0}%"></div></div><b style="text-align:right">${v}</b></div>`).join('');
}
function renderMinutes() {
  const all = []; G.forEach(g => (g.events||[]).forEach(e => { if (e.key==='goals' && typeof e.t==='number') all.push({...e, g}); }));
  const avg = all.length ? all.reduce((s,e)=>s+e.t,0)/all.length : 0;
  let topTxt = ''; if (all.length) { const cnt = {}; all.forEach(e => { const b=Math.floor(Math.floor(e.t/60)/15); cnt[b]=(cnt[b]||0)+1; }); const b = +Object.keys(cnt).sort((x,y)=>cnt[y]-cnt[x])[0]; topTxt = `Most goals between ${b*15+1}' and ${(b+1)*15}'`; }
  document.getElementById('mn-all').innerHTML = `<div class="card" style="padding:12px 14px"><div class="cond" style="font-size:16px;font-weight:800">⏱ All goals</div><div class="dim" style="font-size:10px;margin-bottom:6px">${all.length} goals in ${new Set(all.map(e=>e.g.id)).size} games with minutes${all.length?' · average '+fmtMin(avg):''}</div>${blocks(all)}${topTxt?`<div style="font-size:11px;color:var(--g);font-weight:700;margin-top:6px">${topTxt}</div>`:''}</div>`;
  const b = document.getElementById('mn-el'); b.textContent = ELIG+'%+'; b.classList.toggle('on', mnElig);
  const pg = playerGames(G), mn = mnElig ? minFor(G.length) : 0;
  const sc = [...new Set(all.map(e=>e.player))].filter(p => (pg[p]||{g:0}).g >= mn).sort();
  const sel = document.getElementById('mn-sel'), prev = sel.value;
  sel.innerHTML = sc.length ? sc.map(p=>`<option>${esc(p)}</option>`).join('') : '<option value="">No players yet</option>';
  sel.value = sc.includes(prev) ? prev : (sc[0]||'');
  const n = sel.value, out = document.getElementById('mn-player');
  if (!n) { out.innerHTML = ''; return; }
  const mine = all.filter(e=>e.player===n), a2 = mine.reduce((s,e)=>s+e.t,0)/mine.length, d = Math.round((a2-avg)/60);
  const astOf = e => { const x = (e.g.events||[]).find(y => y.key==='assists' && y.goalId===e.id); return x ? ' · 🎯 '+esc(x.player) : ''; };
  out.innerHTML = `<div class="card" style="padding:12px 14px"><div class="cond" style="font-size:16px;font-weight:800">⚽ ${esc(n)}</div><div class="dim" style="font-size:10px;margin-bottom:6px">${mine.length} goal${mine.length>1?'s':''} · average ${fmtMin(a2)} · ${d===0?'same as the group':d<0?Math.abs(d)+' min earlier than average':d+' min later than average'}</div>${blocks(mine)}
    <div style="margin-top:8px">${mine.slice().sort((x,y)=>num(y.g.id)-num(x.g.id)||x.t-y.t).map(e=>`<div class="li" style="cursor:pointer" onclick="gameDetail('${esc(e.g.id)}')"><span class="nm" style="font-weight:500">#${esc(e.g.id)} · ${esc(e.g.date)}<span class="s">${astOf(e)}</span></span><span class="v">${fmtMin(e.t)}</span></div>`).join('')}</div></div>`;
}

load();
</script>
