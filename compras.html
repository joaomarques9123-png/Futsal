<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Compras</title>
<style>
:root{--bg:#F2F2F7;--card:#FFFFFF;--card2:#F2F2F7;--ink:#000000;--mu:#8A8A8E;--ln:#E3E3E8;--chv:#C4C4C7;--ac:#2FA552;--ac-ink:#FFFFFF;--acs:#E2F4E7;--red:#FF3B30;--hl:#FFF4D6;--hlink:#6B4C00;--segon:#FFFFFF;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#000000;--card:#1C1C1E;--card2:#2C2C2E;--ink:#FFFFFF;--mu:#8D8D93;--ln:#38383A;--chv:#5A5A5E;--ac:#30D158;--ac-ink:#00210B;--acs:#0F3019;--red:#FF453A;--hl:#3A2F12;--hlink:#FFD479;--segon:#636366;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
body.lock{overflow:hidden}
main{max-width:600px;margin:0 auto;padding:4px 16px 28px}
button{cursor:pointer;font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
h1,h2,p{margin:0}

/* navegação */
.nav{height:44px;display:flex;align-items:center}
.navb{background:none;border:0;color:var(--ac);font-size:17px;padding:6px 0}
.lt{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:2px 4px}
.sub{color:var(--mu);font-size:15px;margin:4px 4px 18px}
.home .lt{margin-top:26px}

/* widgets */
.wg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.w{border:0;border-radius:22px;padding:15px;min-height:156px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;text-align:left;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.w .ic{font-size:24px;line-height:1}
.w b{display:block;font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1}
.w b small{font-size:20px;opacity:.7;font-weight:600}
.w .t{display:block;font-size:15px;font-weight:600;margin-top:4px}
.w .s{display:block;font-size:12.5px;opacity:.88;margin-top:2px;line-height:1.3}

/* grupos */
.gh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.02em;margin:20px 16px 7px}
.gh .lnk{text-transform:none;font-size:15px}
.g{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:8px}
.r{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:10px 14px;background:none;border:0;color:inherit;text-align:left;font-size:16px}
.g .r + .r::before,.g .r + .picker::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:.5px solid var(--ln)}
.g.ic .r + .r::before{left:56px}
.g.days .r + .r::before{left:70px}
.ri,.zi{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:15px;flex:none;color:#fff;background:var(--c);font-weight:700}
.n{flex:1;min-width:0;display:flex;flex-direction:column}
.n > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n small{color:var(--mu);font-size:13px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v{color:var(--mu);font-size:15px;white-space:nowrap}
.chv{color:var(--chv);font-size:22px;line-height:1;flex:none}
.cir{width:24px;height:24px;border-radius:50%;border:2px solid var(--chv);flex:none}
.cir.on{background:var(--ac);border-color:var(--ac);box-shadow:inset 0 0 0 3.5px var(--card)}
.cirb{display:flex;align-items:center;gap:12px;flex:1;min-width:0;background:none;border:0;padding:0;color:inherit;text-align:left;font-size:16px}
.cirbtn{background:none;border:0;padding:4px;flex:none}
.got .nm{color:var(--mu);text-decoration:line-through}
.mini{display:block;height:4px;border-radius:2px;background:var(--ln);overflow:hidden;margin-top:7px}
.mini i{display:block;height:100%;background:var(--ac)}
.empty{color:var(--mu);font-size:15px;padding:14px;line-height:1.4}
.tag{font-size:12px;font-weight:600;color:var(--ac);background:var(--acs);padding:2px 7px;border-radius:6px;margin-left:6px}

/* botões e campos */
.btn{border:0;border-radius:14px;padding:14px;background:var(--card);color:var(--ac);font-size:16px;font-weight:600}
.btn.pri{background:var(--ac);color:var(--ac-ink)}
.btn.danger{color:var(--red)}
.btn.wide{display:block;width:100%;margin:8px 0}
.btn:disabled{opacity:.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.grid2 .btn{padding:12px 8px;font-size:15px}
.lnk{background:none;border:0;color:var(--ac);font-size:15px;padding:2px}
.sm{border:0;border-radius:9px;padding:7px 12px;background:var(--card2);color:var(--ac);font-size:14px;font-weight:600;flex:none}
.inp{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:0;border-radius:12px;background:var(--card);color:var(--ink)}
.g .inp{background:transparent;border-radius:0;padding:14px}
.qty{width:58px;text-align:center;font:inherit;font-size:15px;padding:7px 4px;border:0;border-radius:8px;background:var(--card2);color:var(--ink)}
.unit{width:30px;color:var(--mu);font-size:13px}
.x{background:none;border:0;color:var(--mu);font-size:22px;line-height:1;padding:0 4px;flex:none}
.stp{display:flex;align-items:center;background:var(--card2);border-radius:9px;flex:none}
.stp button{width:32px;height:32px;border:0;background:none;color:var(--ac);font-size:20px}
.stp .sqb{width:auto;min-width:52px;color:var(--ink);font-size:13.5px;padding:0 2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stp em{font-style:normal;min-width:40px;text-align:center;font-size:15px;font-weight:600}
.dock{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;margin-top:16px;padding:8px;background:var(--card);border-radius:18px;box-shadow:0 6px 24px rgba(0,0,0,.14);z-index:5}
@supports (backdrop-filter:blur(1px)){.dock{background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}}
.dock .btn{padding:12px 16px}
.dock .pri{flex:1}
.seg{display:flex;background:rgba(118,118,128,.14);border-radius:9px;padding:2px;margin:0 0 14px}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:7px 4px;font-size:13.5px;font-weight:600;color:var(--ink)}
.seg button.on{background:var(--segon);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.tools{display:flex;gap:8px;margin-bottom:6px}
.tools .inp{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:7px;padding:9px 13px;border:0;border-radius:999px;background:var(--card);color:var(--ink);font-size:14.5px;font-weight:500}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.chip.on{background:var(--ac);color:var(--ac-ink)}
.chip.on i{box-shadow:0 0 0 2px var(--ac-ink)}
.sw{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.sw button{aspect-ratio:1;border-radius:50%;border:3px solid var(--bg);background:var(--c);box-shadow:0 0 0 2px transparent}
.sw button.on{box-shadow:0 0 0 2px var(--ink)}
.lbl{font-size:13px;color:var(--mu);text-transform:uppercase;margin:20px 16px 7px;letter-spacing:.02em}
.ord{display:flex;gap:4px;flex:none}
.ord button{width:32px;height:32px;border:0;border-radius:8px;background:var(--card2);color:var(--ac);font-size:15px}
.ord button:disabled{opacity:.3}

/* procurar produto */
.picker{position:relative}
.sug{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border:0;border-top:.5px solid var(--ln);background:none;color:var(--ink);text-align:left;font-size:16px}
.sug.new{color:var(--ac);font-weight:600}
.sug .zi{width:22px;height:22px;font-size:11px;border-radius:6px}
.ask{padding:12px 14px;border-top:.5px solid var(--ln)}
.ask p{font-size:14px;color:var(--mu);margin-bottom:10px}
.ask .chip{background:var(--card2)}

/* compras */
.pbar{height:6px;border-radius:3px;background:var(--ln);overflow:hidden;margin:0 4px 14px}
.pbar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.zh{font-weight:600}
.zone .zb{border-top:.5px solid var(--ln)}
.zone .chev{transition:transform .2s;transform:rotate(90deg)}
.zone.closed .chev{transform:none}
.zone.closed .zb{display:none}
.zone.done .zh .nm{color:var(--mu);text-decoration:line-through}

/* refeições */
.wknav{display:flex;align-items:center;justify-content:space-between;padding:10px;border-bottom:.5px solid var(--ln)}
.wknav button{width:38px;height:38px;border-radius:10px;border:0;background:var(--card2);color:var(--ac);font-size:22px}
.wknav button:disabled{opacity:.3}
.wknav div{text-align:center;display:flex;flex-direction:column}
.wknav b{font-size:16px;font-weight:600}
.wknav small{color:var(--mu);font-size:13px;margin-top:2px}
.dd{width:44px;height:44px;border-radius:12px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
.dd small{font-size:10.5px;color:var(--mu);margin-bottom:3px;font-weight:600;text-transform:uppercase}
.dd b{font-size:18px;font-weight:600}
.now .dd{background:var(--ac);color:var(--ac-ink)}
.now .dd small{color:inherit;opacity:.85}
.past{opacity:.5}
.prep{background:var(--hl);color:var(--hlink)}
.prep .n small{color:inherit;opacity:.8}

/* folhas */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.sheet-wrap[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;max-height:90vh;overflow:auto;background:var(--bg);border-radius:14px 14px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .25s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--chv);margin:2px auto 14px}
.sheet h2{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0 4px 4px}
.shs{color:var(--mu);font-size:15px;margin:0 4px 2px}
.sheet .sub{margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:rgba(30,30,32,.94);color:#fff;padding:11px 16px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.banner{background:var(--hl);color:var(--hlink);padding:10px 12px;border-radius:12px;font-size:14px;margin:10px 0 0}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.pbar i,#toast,.zone .chev{transition:none}}
</style>
</head>
<body>
<main id="main"></main>
<div id="sheetWrap" class="sheet-wrap" hidden><div class="sheet-bg" data-act="closeSheet"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>

<script>
'use strict';
const KEY='compras_app_v1';
const SLOT='jantar';
const DN=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const SD=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const UNITS=['un','kg','g','L','emb'];
const ZC=['#34C759','#FF9500','#FF3B30','#007AFF','#32ADE6','#AF52DE','#FF2D55','#A2845E'];
const WKL={'-1':'Semana passada','0':'Esta semana','1':'Próxima semana','2':'Daqui a 2 semanas','3':'Daqui a 3 semanas'};
const NOZ={id:'_',nome:'Sem zona',cor:'#8E8E93',ordem:9999};

const $=s=>document.querySelector(s);
const now=()=>Date.now();
const uid=()=>now().toString(36)+Math.random().toString(36).slice(2,8);
const norm=s=>(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseYmd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dm=d=>`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
const dow=d=>(d.getDay()+6)%7;
const r2=v=>Math.round(v*100)/100;
const fq=n=>String(r2(+n||0)).replace('.',',');
const pq=s=>{const v=parseFloat(String(s).replace(',','.'));return isFinite(v)&&v>0?r2(v):1};
const plural=(n,a,b)=>`${n} ${n===1?a:b}`;
const dt=ts=>new Date(ts).toLocaleString('pt-PT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const stepOf=u=>u==='g'?100:(u==='kg'||u==='L')?0.5:1;
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}

/* ---------- dados ---------- */
let storageOK=true;
try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){storageOK=false}
function blank(){return{v:2,zonas:[],produtos:[],listas:[],pratos:[],refeicoes:{},apagados:{},ultimoExport:0}}
function migrate(d){
  d=Object.assign(blank(),d||{});
  ['zonas','produtos','listas','pratos'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});
  if(!d.refeicoes||typeof d.refeicoes!=='object')d.refeicoes={};
  if(!d.apagados||typeof d.apagados!=='object')d.apagados={};
  if(!d.zonas.length&&d.produtos.some(p=>p.corredor!=null)){
    [...new Set(d.produtos.map(p=>+p.corredor||1))].sort((a,b)=>a-b)
      .forEach(n=>d.zonas.push({id:'z'+n,nome:'Zona '+n,cor:ZC[(n-1)%ZC.length],ordem:n,upd:1}));
  }
  d.produtos.forEach(p=>{if(p.zona===undefined&&p.corredor!=null)p.zona='z'+p.corredor;delete p.corredor});
  d.pratos.forEach(p=>{if(!(p.doses>0))p.doses=2;if(!Array.isArray(p.ingredientes))p.ingredientes=[]});
  Object.values(d.refeicoes).forEach(r=>{if(!r.ov)r.ov={};if(!Array.isArray(r.env))r.env=[]});
  d.listas.forEach(l=>{if(!Array.isArray(l.itens))l.itens=[]});
  d.v=2;return d;
}
function seed(){
  const d=blank(),t=now();
  ['Frutas e legumes','Padaria','Talho e peixaria','Laticínios','Mercearia','Limpeza'].forEach((n,i)=>d.zonas.push({id:'zs'+(i+1),nome:n,cor:[ZC[0],ZC[7],ZC[2],ZC[3],ZC[1],ZC[5]][i],ordem:i+1,upd:t}));
  [['Bananas',1,'kg'],['Tomate',1,'kg'],['Cebola',1,'kg'],['Pão',2,'un'],['Frango',3,'kg'],['Carne picada',3,'kg'],['Leite',4,'L'],['Iogurtes',4,'emb'],['Ovos',4,'un'],['Queijo',4,'un'],
   ['Arroz',5,'emb'],['Massa',5,'emb'],['Azeite',5,'L'],['Atum',5,'un'],['Detergente da loiça',6,'un'],['Papel higiénico',6,'emb']]
   .forEach(([n,z,u])=>d.produtos.push({id:uid(),nome:n,zona:'zs'+z,unidade:u,upd:t}));
  return d;
}
function load(){
  if(storageOK){try{const r=localStorage.getItem(KEY);if(r)return migrate(JSON.parse(r))}catch(e){}}
  return seed();
}
let S=load();
function save(){if(!storageOK)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Não foi possível guardar os dados')}}
function commit(){save();render();if(sheetFn)renderSheet()}

const prod=id=>S.produtos.find(p=>p.id===id);
const prato=id=>S.pratos.find(p=>p.id===id);
const lista=id=>S.listas.find(l=>l.id===id);
const zona=id=>S.zonas.find(z=>z.id===id);
const zOf=p=>zona(p.zona)||NOZ;
const zonasOrd=()=>[...S.zonas].sort((a,b)=>a.ordem-b.ordem||a.nome.localeCompare(b.nome,'pt'));
const drafts=()=>S.listas.filter(l=>l.estado==='rascunho').sort((a,b)=>b.upd-a.upd);
const pends=()=>S.listas.filter(l=>l.estado==='pendente').sort((a,b)=>b.upd-a.upd);
const lname=l=>(l.nome||'').trim()||'Lista sem nome';
const cnt=l=>l.itens.filter(i=>prod(i.pid)).length;
const zIcon=z=>`<span class="zi" style="--c:${z.cor}">${esc((z.nome||'?').trim().charAt(0).toUpperCase())}</span>`;
function newDraft(){const d={id:uid(),nome:'',estado:'rascunho',itens:[],criada:now(),upd:now()};S.listas.push(d);return d}
function addItems(L,pairs){
  pairs.forEach(({pid,qtd})=>{if(!prod(pid)||!(qtd>0))return;const it=L.itens.find(i=>i.pid===pid);
    if(it){it.qtd=r2(it.qtd+qtd);it.feito=false}else L.itens.push({pid,qtd:r2(qtd),feito:false})});
  L.upd=now();
}
function tomb(id){S.apagados[id]=now()}
function sortItems(items){
  return items.map(i=>{const p=prod(i.pid);return p?{...i,p,z:zOf(p)}:null}).filter(Boolean)
    .sort((a,b)=>a.z.ordem-b.z.ordem||a.z.nome.localeCompare(b.z.nome,'pt')||a.p.nome.localeCompare(b.p.nome,'pt'));
}
function groupZ(list){const out=[];list.forEach(i=>{let g=out[out.length-1];if(!g||g.z.id!==i.z.id){g={z:i.z,items:[]};out.push(g)}g.items.push(i)});return out}
function weekStart(o){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-dow(d)+o*7);return d}
function mealQ(r,p,pid){
  if(r.ov&&r.ov[pid]!=null)return r.ov[pid];
  const g=p.ingredientes.find(i=>i.pid===pid);if(!g)return 0;
  return r2(g.qtd*(r.doses||p.doses)/p.doses);
}

/* ---------- estado da interface ---------- */
let tab='inicio',editId=null,shopId=null,wk=0,selJ=null,catTab='produtos',prodQ='',slotQ='',slotChoose=false;
let sheetFn=null,refocus=null,PT=null,PTMP=null,ZT=null,IMP=null,ADDQ=null,MS=null,PLAN=null,PLANDAYS=[];
const OPEN={};
const PICK={};
const draft=()=>{const l=editId&&lista(editId);return l&&l.estado==='rascunho'?l:null};

/* ---------- render ---------- */
function render(){
  if(tab==='shop'&&!lista(shopId))tab='listas';
  if(tab==='edit'&&!draft())tab='listas';
  const V={inicio:vInicio,listas:vListas,edit:vEdit,shop:vShop,refeicoes:vRef,catalogo:vCat};
  const m=$('#main');
  m.className=tab==='inicio'?'home':'';
  m.innerHTML=(storageOK?'':`<div class="banner">Nesta pré-visualização os dados não ficam guardados. Descarrega o ficheiro e abre-o no navegador do telemóvel.</div>`)+V[tab]();
  bindPickers(m);doRefocus(m);
}
function doRefocus(root){if(!refocus)return;const i=root.querySelector(`[data-picker="${refocus}"] input`);if(i){i.focus({preventScroll:true});refocus=null}}
function head(t,sub,back){
  const b=back||{act:'data-act="go" data-v="inicio"',label:'Início'};
  return `<div class="nav"><button class="navb" ${b.act}>‹ ${b.label}</button></div><h1 class="lt">${t}</h1>${sub?`<p class="sub">${sub}</p>`:'<div style="height:14px"></div>'}`;
}
const BACK_LISTAS={act:'data-act="go" data-v="listas"',label:'Listas'};

function pickerHTML(n,ph){return `<div class="picker" data-picker="${n}"><input class="inp" placeholder="${ph}" autocomplete="off" enterkeyhint="done" aria-label="${ph}"><div class="sugs"></div></div>`}
function bindPickers(root){
  root.querySelectorAll('[data-picker]').forEach(w=>{
    const name=w.dataset.picker,inp=w.querySelector('input'),box=w.querySelector('.sugs');
    const pick=pid=>{inp.value='';box.innerHTML='';if(PICK[name])PICK[name](pid)};
    const show=()=>{
      const raw=inp.value.trim(),q=norm(raw);
      if(!q){box.innerHTML='';return}
      const m=S.produtos.filter(p=>norm(p.nome).includes(q))
        .sort((a,b)=>norm(a.nome).indexOf(q)-norm(b.nome).indexOf(q)||a.nome.localeCompare(b.nome,'pt')).slice(0,6);
      const ex=S.produtos.some(p=>norm(p.nome)===q);
      box.innerHTML=m.map(p=>`<button type="button" class="sug" data-pid="${p.id}">${zIcon(zOf(p))}<span>${esc(p.nome)}</span></button>`).join('')
        +(ex?'':`<button type="button" class="sug new" data-new="1">+ Criar «${esc(raw)}»</button>`);
    };
    inp.addEventListener('input',show);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const f=box.querySelector('.sug');if(f)f.click()}});
    box.addEventListener('click',e=>{
      const c=e.target.closest('[data-zn]');
      if(c){const nome=box.dataset.nome;const p={id:uid(),nome,zona:c.dataset.zn||null,unidade:'un',upd:now()};
        S.produtos.push(p);save();toast(`«${nome}» criado em ${zOf(p).nome}`);pick(p.id);return}
      const b=e.target.closest('.sug');if(!b)return;
      if(b.dataset.pid){pick(b.dataset.pid);return}
      const nome=inp.value.trim();box.dataset.nome=nome;
      box.innerHTML=`<div class="ask"><p>Em que zona fica «${esc(nome)}»?</p><div class="chips">${zonasOrd().map(z=>`<button type="button" class="chip" data-zn="${z.id}" style="--c:${z.cor}"><i></i>${esc(z.nome)}</button>`).join('')}<button type="button" class="chip" data-zn="" style="--c:${NOZ.cor}"><i></i>Sem zona</button></div></div>`;
    });
  });
}

/* ---------- ecrãs ---------- */
function vInicio(){

  const ws=weekStart(0);let nm=0;for(let i=0;i<7;i++){const x=S.refeicoes[ymd(addDays(ws,i))+'|'+SLOT];if(x&&prato(x.pratoId))nm++}
  const W=(act,g,ic,n,t,s)=>`<button class="w" ${act} style="background:linear-gradient(160deg,${g})"><span class="ic">${ic}</span><span>${n!==''?`<b>${n}</b>`:''}<span class="t">${t}</span><span class="s">${s}</span></span></button>`;
  return `<h1 class="lt">Compras</h1><p class="sub">${DN[dow(td)]}, ${td.getDate()} de ${td.toLocaleDateString('pt-PT',{month:'long'})}</p>
  <div class="wg">
    ${W('data-act="go" data-v="listas"','#4C8DF6,#2F6FE0','🧾',ds.length+ps.length,'Listas',`${ds.length} a fazer, ${ps.length} para comprar`)}

    ${W('data-act="go" data-v="catalogo"','#3CC16E,#22A055','🥫',S.produtos.length,'Produtos',`${plural(S.pratos.length,'refeição','refeições')}, ${plural(S.zonas.length,'zona','zonas')}`)}
    ${W('data-act="shareSheet"','#A57CF0,#8657E0','🔄','','Partilhar',S.ultimoExport?'Última vez '+dt(S.ultimoExport):'Enviar ou importar dados')}
  </div>`;
}

function vListas(){
  const ds=drafts(),ps=pends(),conc=S.listas.filter(l=>l.estado==='concluida').sort((a,b)=>b.upd-a.upd).slice(0,8);

  <div class="gh"><span>Para comprar</span>${ps.length>1?`<button class="lnk" data-act="toggleJuntar">${selJ?'Cancelar':'Juntar'}</button>`:''}</div>
  ${selJ?`<p class="sub" style="margin:-2px 16px 8px;font-size:13px">Toca nas listas a juntar. As quantidades do mesmo produto somam-se.</p>`:''}
  <div class="g ic">${ps.length?ps.map(rowP).join(''):`<p class="empty">Quando fechares uma lista, ela aparece aqui pronta para as compras.</p>`}</div>
  ${selJ?`<div class="dock"><button class="btn pri" data-act="juntar" ${selJ.size<2?'disabled':''}>${selJ.size<2?'Escolhe pelo menos 2 listas':`Juntar ${selJ.size} listas`}</button></div>`:''}

function vEdit(){

function vShop(){
  const L=lista(shopId),items=sortItems(L.itens),done=items.filter(i=>i.feito).length;
  const row=i=>`<div class="r${i.feito?' got':''}"><button class="cirb" data-act="shopToggle" data-pid="${i.pid}"><span class="cir${i.feito?' on':''}"></span><span class="n"><span class="nm">${esc(i.p.nome)}</span></span></button><span class="stp"><button data-act="shopQty" data-pid="${i.pid}" data-d="-1" aria-label="Menos ${esc(i.p.nome)}">−</button><button class="sqb" data-act="shopQtySet" data-pid="${i.pid}" aria-label="Alterar quantidade">${fq(i.qtd)} ${esc(i.p.unidade)}</button><button data-act="shopQty" data-pid="${i.pid}" data-d="1" aria-label="Mais ${esc(i.p.nome)}">+</button></span></div>`;
  const zones=groupZ(items).map(g=>{const t=g.items.length,f=g.items.filter(i=>i.feito).length,all=f===t,key=shopId+'|'+g.z.id,open=OPEN[key]!==undefined?OPEN[key]:!all;
    return `<div class="g zone${open?'':' closed'}${all?' done':''}"><button class="r zh" data-act="zt" data-k="${key}" data-o="${open?1:0}" aria-expanded="${open}">${zIcon(g.z)}<span class="n"><span class="nm">${esc(g.z.nome)}</span></span><span class="v">${f}/${t}${all?' ✓':''}</span><span class="chv chev">›</span></button><div class="zb">${g.items.map(row).join('')}</div></div>`}).join('');
  return `${head(esc(L.nome),items.length?(done<items.length?`Faltam ${items.length-done} de ${items.length}`:'Tudo no carrinho'):'Lista vazia',BACK_LISTAS)}
  <div class="pbar"><i style="width:${items.length?done/items.length*100:0}%"></i></div>

  <div class="gh"><span>Esqueceste-te de algo?</span></div>
  <div class="g">${pickerHTML('shopAdd','Adicionar à lista')}</div>
  ${items.length&&done<items.length?`<button class="btn wide" data-act="concluir">Concluir compras mesmo assim</button>`:''}`;

function vRef(){
  const ws=weekStart(wk),t=ymd(new Date());let planned=0;
  const rows=[0,1,2,3,4,5,6].map(i=>{const d=addDays(ws,i),k=ymd(d),key=k+'|'+SLOT,r=S.refeicoes[key],p=r&&prato(r.pratoId);if(p)planned++;
    const info=p?(p.prep?`<small>⏰ ${esc(p.prep)}</small>`:(r.doses&&r.doses!==p.doses?`<small>${plural(r.doses,'dose','doses')}</small>`:'')):'';
    return `<div class="r${k===t?' now':''}${k<t?' past':''}${p&&r.feito?' got':''}"><button class="cirb" data-act="openSlot" data-k="${key}"><span class="dd"><small>${SD[i]}</small><b>${d.getDate()}</b></span><span class="n">${p?`<span class="nm">${esc(p.nome)}</span>${info}`:'<span style="color:var(--mu)">Escolher refeição</span>'}</span></button>${p?`<button class="cirbtn" data-act="feito" data-k="${key}" aria-label="Marcar como feito"><span class="cir${r.feito?' on':''}"></span></button>`:'<span class="chv">›</span>'}</div>`}).join('');
  return `${head('Refeições','Toca num dia para escolher ou ver a refeição')}
  <div class="g days"><div class="wknav"><button data-act="wk" data-d="-1" ${wk<=-1?'disabled':''} aria-label="Semana anterior">‹</button><div><b>${WKL[wk]}</b><small>${dm(ws)} a ${dm(addDays(ws,6))}, ${planned} de 7 planeados</small></div><button data-act="wk" data-d="1" ${wk>=3?'disabled':''} aria-label="Semana seguinte">›</button></div>${rows}</div>
  <button class="btn pri wide" data-act="sendWeek">Enviar ingredientes da semana</button>`;
}

function nextDate(id){const t=ymd(new Date());const ks=Object.keys(S.refeicoes).filter(k=>S.refeicoes[k].pratoId===id&&k.split('|')[0]>=t).sort();if(!ks.length)return '';const d=parseYmd(ks[0].split('|')[0]);return `, próxima ${SD[dow(d)]} ${dm(d)}`}
function vCat(){
  const q=norm(prodQ);
  const seg=`<div class="seg">${[['produtos','Produtos'],['pratos','Refeições'],['zonas','Zonas']].map(([c,l])=>`<button class="${catTab===c?'on':''}" data-act="catTab" data-c="${c}">${l}</button>`).join('')}</div>`;
  let body='';
  if(catTab==='zonas'){
    const zs=zonasOrd();
    body=`<div class="g ic">${zs.map((z,i)=>`<div class="r"><button class="cirb" data-act="editZona" data-id="${z.id}">${zIcon(z)}<span class="n"><span>${esc(z.nome)}</span><small>${plural(S.produtos.filter(p=>p.zona===z.id).length,'produto','produtos')}</small></span></button><span class="ord"><button data-act="zMove" data-id="${z.id}" data-d="-1" ${i===0?'disabled':''} aria-label="Subir">↑</button><button data-act="zMove" data-id="${z.id}" data-d="1" ${i===zs.length-1?'disabled':''} aria-label="Descer">↓</button></span></div>`).join('')||'<p class="empty">Ainda não tens zonas.</p>'}</div>
    <p class="sub" style="margin:8px 16px 4px;font-size:13px">A ordem das zonas é a ordem em que aparecem na lista de compras.</p>
    <button class="btn pri wide" data-act="novaZona">+ Nova zona</button>`;
  }else{
    const tools=`<div class="tools"><input class="inp" id="prodSearch" placeholder="${catTab==='pratos'?'Procurar refeição':'Procurar produto'}" value="${esc(prodQ)}" aria-label="Procurar"><button class="btn" style="padding:12px 16px" data-act="${catTab==='pratos'?'novoPrato':'novoProd'}">${catTab==='pratos'?'Nova':'Novo'}</button></div>`;
    if(catTab==='pratos'){
      const ps=S.pratos.filter(p=>!q||norm(p.nome).includes(q)).sort((a,b)=>a.nome.localeCompare(b.nome,'pt'));
      body=tools+(ps.length?`<div class="g ic" style="margin-top:12px">${ps.map(p=>`<div class="r"><button class="cirb" data-act="editPrato" data-id="${p.id}"><span class="ri" style="--c:#FF9500">🍲</span><span class="n"><span>${esc(p.nome)}</span><small>${plural(p.ingredientes.length,'ingrediente','ingredientes')}, para ${p.doses}${nextDate(p.id)}</small></span></button><button class="sm" data-act="planPrato" data-id="${p.id}">Planear</button></div>`).join('')}</div>`
        :`<p class="empty">${S.pratos.length?'Nenhuma refeição com esse nome.':'Cria uma refeição com os ingredientes e depois escolhe os dias em que a vão cozinhar.'}</p>`);
    }else{
      const list=S.produtos.filter(p=>!q||norm(p.nome).includes(q)).map(p=>({pid:p.id,p,z:zOf(p)}))
        .sort((a,b)=>a.z.ordem-b.z.ordem||a.z.nome.localeCompare(b.z.nome,'pt')||a.p.nome.localeCompare(b.p.nome,'pt'));
      body=tools+(groupZ(list).map(g=>`<div class="gh"><span>${esc(g.z.nome)}</span></div><div class="g">${g.items.map(i=>`<button class="r" data-act="editProd" data-id="${i.p.id}"><span class="n"><span>${esc(i.p.nome)}</span></span><span class="v">${esc(i.p.unidade)}</span><span class="chv">›</span></button>`).join('')}</div>`).join('')||'<p class="empty">Nenhum produto encontrado.</p>');
    }
  }
  return `${head('Produtos e refeições',`${plural(S.produtos.length,'produto','produtos')}, ${plural(S.pratos.length,'refeição','refeições')}, ${plural(S.zonas.length,'zona','zonas')}`)}${seg}${body}`;
}

function openSheet(fn){sheetFn=fn;$('#sheetWrap').hidden=false;document.body.classList.add('lock');$('#sheet').scrollTop=0;renderSheet()}
function renderSheet(){const s=$('#sheet'),st=s.scrollTop;s.innerHTML='<div class="grab"></div>'+sheetFn();bindPickers(s);s.scrollTop=st;doRefocus(s)}
function closeSheet(){sheetFn=null;MS=null;$('#sheetWrap').hidden=true;document.body.classList.remove('lock')}
const slotTitle=k=>{const d=parseYmd(k.split('|')[0]);return `${DN[dow(d)]}, ${d.getDate()} de ${d.toLocaleDateString('pt-PT',{month:'long'})}`};

function sheetProd(id){

    <div class="lbl">Unidade</div><div class="chips">${UNITS.map(u=>`<button class="chip${PTMP.unidade===u?' on':''}" data-act="pUni" data-u="${u}">${u}</button>`).join('')}</div>
    <button class="btn pri wide" style="margin-top:22px" data-act="pSave">Guardar</button>${PTMP.id?`<button class="btn danger wide" data-act="pDel">Apagar produto</button>`:''}`);
}
const readProd=()=>{const n=$('#pNome');if(n)PTMP.nome=n.value};

function sheetZona(id){

  ZT={id,nome:z?z.nome:'',cor:z?z.cor:ZC[S.zonas.length%ZC.length]};

const readZona=()=>{const n=$('#zNome');if(n)ZT.nome=n.value};

function sheetPrato(id,onSave,nomeInicial){
  const p=id?prato(id):null;
  PT={id:p?p.id:null,nome:p?p.nome:(nomeInicial||''),prep:p?(p.prep||''):'',doses:p?p.doses:2,ingredientes:p?p.ingredientes.map(i=>({...i})):[],onSave};
  PICK.ingAdd=pid=>{readPT();const it=PT.ingredientes.find(i=>i.pid===pid);if(it)it.qtd+=1;else PT.ingredientes.push({pid,qtd:1});refocus='ingAdd';renderSheet()};
  openSheet(()=>{const ing=sortItems(PT.ingredientes);return `<h2>${PT.id?'Editar refeição':'Nova refeição'}</h2>

    <div class="g" style="margin-top:12px"><div class="r"><span class="n"><span>Receita para</span><small>As quantidades abaixo são para este nº de pessoas</small></span><span class="stp"><button data-act="ptDose" data-d="-1" aria-label="Menos">−</button><em>${PT.doses}</em><button data-act="ptDose" data-d="1" aria-label="Mais">+</button></span></div></div>
    <div class="lbl">Ingredientes</div>
    <div class="g">${ing.map(i=>`<div class="r"><span class="n"><span>${esc(i.p.nome)}</span></span><input class="qty" inputmode="decimal" data-ing="${i.pid}" value="${fq(i.qtd)}" aria-label="Quantidade de ${esc(i.p.nome)}"><span class="unit">${esc(i.p.unidade)}</span><button class="x" data-act="ingDel" data-pid="${i.pid}" aria-label="Remover">×</button></div>`).join('')}${pickerHTML('ingAdd','Adicionar ingrediente')}</div>
    <div class="lbl">Preparar na véspera (opcional)</div><div class="g"><input class="inp" id="ptPrep" value="${esc(PT.prep)}" placeholder="Ex.: descongelar o frango"></div>

}
function readPT(){const s=$('#sheet'),n=s.querySelector('#ptNome'),pr=s.querySelector('#ptPrep');if(n)PT.nome=n.value;if(pr)PT.prep=pr.value;
  s.querySelectorAll('[data-ing]').forEach(i=>{const it=PT.ingredientes.find(x=>x.pid===i.dataset.ing);if(it)it.qtd=pq(i.value)})}

function sheetSlot(k){
  slotQ='';slotChoose=false;MS={k,sel:new Set()};
  openSheet(()=>{
    const r=S.refeicoes[k],p=r&&prato(r.pratoId);
    if(p&&!slotChoose){
      const dz=r.doses||p.doses,ing=sortItems(p.ingredientes),env=new Set(r.env||[]);
      const all=ing.length&&ing.every(i=>MS.sel.has(i.pid)),n=MS.sel.size;
      return `<p class="shs">${slotTitle(k)}</p><h2>${esc(p.nome)}</h2><div style="height:10px"></div>
      ${p.prep?`<div class="g"><div class="r prep"><span class="ri" style="--c:#FF9500">⏰</span><span class="n"><span>${esc(p.prep)}</span><small>Na véspera</small></span></div></div>`:''}
      <div class="g"><div class="r"><span class="n"><span>Doses neste dia</span><small>Receita para ${p.doses}${dz!==p.doses?`, quantidades ×${fq(dz/p.doses)}`:''}</small></span><span class="stp"><button data-act="mDose" data-d="-1" aria-label="Menos doses">−</button><em>${dz}</em><button data-act="mDose" data-d="1" aria-label="Mais doses">+</button></span></div></div>
      <div class="gh"><span>Ingredientes</span>${ing.length?`<button class="lnk" data-act="mAll">${all?'Desmarcar todos':'Marcar todos'}</button>`:''}</div>
      <div class="g">${ing.length?ing.map(i=>`<div class="r"><button class="cirb" data-act="mSel" data-pid="${i.pid}"><span class="cir${MS.sel.has(i.pid)?' on':''}"></span><span class="n"><span>${esc(i.p.nome)}${env.has(i.pid)?'<span class="tag">na lista</span>':''}</span></span></button><span class="stp"><button data-act="mQ" data-pid="${i.pid}" data-d="-1" aria-label="Menos">−</button><span class="sqb" style="display:inline-block;text-align:center;line-height:32px">${fq(mealQ(r,p,i.pid))} ${esc(i.p.unidade)}</span><button data-act="mQ" data-pid="${i.pid}" data-d="1" aria-label="Mais">+</button></span></div>`).join('')

async function exportar(){
  S.ultimoExport=now();save();render();
  const json=JSON.stringify({app:'compras',versao:2,exportado:now(),dados:S});
  const name=`compras-${ymd(new Date())}.json`;
  try{const file=new File([json],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Dados das compras'});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
  toast('Ficheiro descarregado');
}
function merge(incRaw){
  const c={zn:0,zu:0,pn:0,pu:0,tn:0,tu:0,ln:0,lu:0,rn:0,ru:0};
  const inc=migrate(JSON.parse(JSON.stringify(incRaw)));
  const T=S.apagados;
  Object.entries(inc.apagados).forEach(([k,v])=>{if(!(T[k]>=v))T[k]=v});
  const dead=(id,upd)=>T[id]!=null&&T[id]>=(upd||0);
  const zmap={};
  inc.zonas.forEach(z=>{const l=S.zonas.find(x=>x.id===z.id)||S.zonas.find(x=>norm(x.nome)===norm(z.nome));
    if(l){zmap[z.id]=l.id;if((z.upd||0)>(l.upd||0)&&(l.nome!==z.nome||l.cor!==z.cor||l.ordem!==z.ordem)){Object.assign(l,{nome:z.nome,cor:z.cor,ordem:z.ordem,upd:z.upd});c.zu++}}
    else if(!dead(z.id,z.upd)){S.zonas.push(z);zmap[z.id]=z.id;c.zn++}});
  const map={};
  inc.produtos.forEach(p=>{
    if(p.zona&&zmap[p.zona])p.zona=zmap[p.zona];
    const l=S.produtos.find(x=>x.id===p.id)||S.produtos.find(x=>norm(x.nome)===norm(p.nome));
    if(l){map[p.id]=l.id;
      if((p.upd||0)>(l.upd||0)&&(l.nome!==p.nome||l.zona!==p.zona||l.unidade!==p.unidade)){l.nome=p.nome;l.zona=p.zona;l.unidade=p.unidade;l.upd=p.upd;c.pu++}}
    else if(!dead(p.id,p.upd)){S.produtos.push(p);map[p.id]=p.id;c.pn++}
  });
  const mp=id=>map[id]||id;
  const fix=arr=>{const o=[];(arr||[]).forEach(i=>{const pid=mp(i.pid),e=o.find(x=>x.pid===pid);if(e){e.qtd=r2(e.qtd+i.qtd);e.feito=!!(e.feito&&i.feito)}else o.push({...i,pid})});return o};
  inc.pratos.forEach(p=>{
    p.ingredientes=fix(p.ingredientes).map(({pid,qtd})=>({pid,qtd}));
    const l=prato(p.id);
    if(l){if((p.upd||0)>(l.upd||0)){Object.assign(l,p);c.tu++}}
    else if(!dead(p.id,p.upd)){S.pratos.push(p);c.tn++}
  });
  inc.listas.forEach(L=>{
    L.itens=fix(L.itens);
    const l=lista(L.id);
    if(l){
      const newer=(L.upd||0)>(l.upd||0)?L:l,older=newer===L?l:L;
      const doneOld=new Set(older.itens.filter(i=>i.feito).map(i=>i.pid));
      const merged={...newer,itens:newer.itens.map(i=>({...i,feito:!!(i.feito||doneOld.has(i.pid))}))};
      if(JSON.stringify(merged)!==JSON.stringify(l)){Object.assign(l,merged);c.lu++}
    }else if(!dead(L.id,L.upd)){S.listas.push(L);c.ln++}
  });
  Object.entries(inc.refeicoes).forEach(([k,r])=>{
    if(dead('ref:'+k,r.upd))return;
    const ov={};Object.entries(r.ov||{}).forEach(([pid,q])=>ov[mp(pid)]=q);r.ov=ov;r.env=(r.env||[]).map(mp);
    const l=S.refeicoes[k];
    if(!l){S.refeicoes[k]=r;c.rn++}else if((r.upd||0)>(l.upd||0)){S.refeicoes[k]=r;c.ru++}
  });
  S.zonas=S.zonas.filter(z=>!dead(z.id,z.upd));
  S.produtos=S.produtos.filter(p=>!dead(p.id,p.upd));
  S.pratos=S.pratos.filter(p=>!dead(p.id,p.upd));
  S.listas=S.listas.filter(l=>!dead(l.id,l.upd));
  Object.keys(S.refeicoes).forEach(k=>{if(dead('ref:'+k,S.refeicoes[k].upd))delete S.refeicoes[k]});
  return c;
}

    if(!confirm(n?`Apagar esta zona? ${plural(n,'produto fica','produtos ficam')} sem zona.`:'Apagar esta zona?'))return;
    S.produtos.forEach(p=>{if(p.zona===id){p.zona=null;p.upd=now()}});S.zonas=S.zonas.filter(z=>z.id!==id);tomb(id);closeSheet();commit()},
  zMove:d=>{const zs=zonasOrd(),i=zs.findIndex(z=>z.id===d.id),j=i+(+d.d);if(i<0||j<0||j>=zs.length)return;
    [zs[i],zs[j]]=[zs[j],zs[i]];zs.forEach((z,k)=>{if(z.ordem!==k+1){z.ordem=k+1;z.upd=now()}});commit()},
  shareSheet:()=>openSheet(()=>`<h2>Partilhar</h2><p class="sub">${S.ultimoExport?'Última partilha: '+dt(S.ultimoExport):'Ainda não partilhaste dados. O ficheiro também serve de cópia de segurança.'}</p>
    <div class="g ic"><button class="r" data-act="shareOut"><span class="ri" style="--c:#8657E0">↑</span><span class="n"><span>Partilhar dados</span><small>Envia o ficheiro por WhatsApp ou email</small></span><span class="chv">›</span></button>
    <button class="r" data-act="shareIn"><span class="ri" style="--c:#2F6FE0">↓</span><span class="n"><span>Importar ficheiro</span><small>Junta os dados que a outra pessoa te enviou</small></span><span class="chv">›</span></button></div>`),
  shareOut:()=>{closeSheet();exportar()},
  shareIn:()=>{closeSheet();$('#fileIn').click()},
  addTo:d=>{const L=d.id?lista(d.id):newDraft();if(!L||!ADDQ)return closeSheet();addItems(L,ADDQ.pairs);const m=ADDQ.msg;ADDQ=null;closeSheet();commit();toast(`${m} a «${lname(L)}»`)},
  impJuntar:()=>{const c=merge(IMP);IMP=null;save();render();
    const lines=sumLine('Zonas',c.zn,c.zu,'nova','novas')+sumLine('Produtos',c.pn,c.pu,'novo','novos')+sumLine('Refeições',c.tn,c.tu,'nova','novas')+sumLine('Listas',c.ln,c.lu,'nova','novas')+sumLine('Dias planeados',c.rn,c.ru,'novo','novos');
    openSheet(()=>`<h2>Dados importados</h2><div style="height:10px"></div>${lines?`<div class="g">${lines}</div>`:'<p class="sub">Já tinhas tudo o que vinha no ficheiro. Nada mudou.</p>'}<button class="btn pri wide" style="margin-top:14px" data-act="closeSheet">Fechar</button>`)},
  impSubst:()=>{if(!confirm('Substituir todos os dados deste telemóvel pelos do ficheiro?'))return;
    S=migrate(JSON.parse(JSON.stringify(IMP)));S.ultimoExport=S.ultimoExport||0;IMP=null;tab='inicio';selJ=null;closeSheet();commit();toast('Dados substituídos')}
};
const CH={
  draftName:(d,t)=>{const x=draft();if(x){x.nome=t.value;x.upd=now();save()}},
  draftQty:(d,t)=>{const x=draft(),it=x&&x.itens.find(i=>i.pid===d.pid);if(it){it.qtd=pq(t.value);x.upd=now();save();t.value=fq(it.qtd)}}
};
PICK.draftAdd=pid=>{const x=draft();if(!x)return;addItems(x,[{pid,qtd:1}]);refocus='draftAdd';commit()};
PICK.shopAdd=pid=>{const L=lista(shopId);if(!L)return;addItems(L,[{pid,qtd:1}]);refocus='shopAdd';commit();toast('Adicionado à lista')};

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset,b)}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.ch&&CH[t.dataset.ch])CH[t.dataset.ch](t.dataset,t)});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='prodSearch'){prodQ=t.value;render();const i=$('#prodSearch');i.focus();i.setSelectionRange(i.value.length,i.value.length)}
  if(t.id==='slotSearch'){slotQ=t.value;renderSheet();const i=$('#slotSearch');i.focus();i.setSelectionRange(i.value.length,i.value.length)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetFn)closeSheet()});
$('#fileIn').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  let data;try{data=JSON.parse(await f.text())}catch(err){toast('Este ficheiro não é um JSON válido');return}
  const inc=data&&data.dados;
  if(!inc||!Array.isArray(inc.produtos)||!Array.isArray(inc.listas)){toast('Este ficheiro não tem dados da app de compras');return}
  IMP=inc;
  openSheet(()=>`<h2>Importar dados</h2><p class="sub">Ficheiro de ${data.exportado?dt(data.exportado):'data desconhecida'}: ${plural(inc.produtos.length,'produto','produtos')}, ${plural(inc.listas.length,'lista','listas')}, ${plural(Object.keys(inc.refeicoes||{}).length,'dia planeado','dias planeados')}.</p>
    <div class="g"><button class="r" data-act="impJuntar"><span class="n"><span>Juntar com os meus dados</span><small>Recomendado. Fica o que é novo e a versão mais recente do que mudou.</small></span><span class="chv">›</span></button>
    <button class="r" data-act="impSubst"><span class="n"><span style="color:var(--red)">Substituir os meus dados</span><small>Apaga o que tens neste telemóvel e fica só com o ficheiro.</small></span><span class="chv">›</span></button></div>`);
});

render();
</script>
</body>
</html>
