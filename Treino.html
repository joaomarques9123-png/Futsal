<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B50E8">
<title>Treino em Casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF1; --surface:#FFFFFF; --surface2:#F3F5F8; --ink:#141C24; --muted:#5B6672;
  --line:#D5DBE2; --accent:#2B50E8; --accent-soft:#E2E8FF; --on-accent:#FFFFFF;
  --heat:#FF5A1F; --fig:#2A3440; --fig2:#A9B2BC; --good:#13915A; --good-soft:#DDF3E8; --chip:#E1E6EC;
  --danger:#C8322B; --t-food:#FFEFD2; --t-water:#DDEBFF; --t-ex:#FFE2D5; --t-prog:#DDF3E8;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1318; --surface:#171E26; --surface2:#1F2731; --ink:#E8EDF2; --muted:#93A0AD;
    --line:#2A3440; --accent:#6E8BFF; --accent-soft:#1F2A4D; --on-accent:#0E1318;
    --heat:#FF6B33; --fig:#D5DDE5; --fig2:#56626E; --good:#3BC486; --good-soft:#123826; --chip:#25303B; --danger:#FF6B63; --t-food:#3A2F17; --t-water:#16283F; --t-ex:#3C2218; --t-prog:#123826;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1318; --surface:#171E26; --surface2:#1F2731; --ink:#E8EDF2; --muted:#93A0AD;
  --line:#2A3440; --accent:#6E8BFF; --accent-soft:#1F2A4D; --on-accent:#0E1318;
  --heat:#FF6B33; --fig:#D5DDE5; --fig2:#56626E; --good:#3BC486; --good-soft:#123826; --chip:#25303B; --danger:#FF6B63; --t-food:#3A2F17; --t-water:#16283F; --t-ex:#3C2218; --t-prog:#123826;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img,svg{max-width:100%}

.app{max-width:560px;margin:0 auto;padding:0 16px 110px}
.home-head{padding:20px 2px 14px}
.home-head h1{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;margin:0;letter-spacing:-.01em}
.home-head .sub{color:var(--muted);margin-top:4px}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 0 12px;position:sticky;top:0;z-index:20;background:var(--bg);padding-top:calc(14px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.topbar h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{width:44px;height:44px;border-radius:14px;border:0;background:var(--surface);display:flex;align-items:center;justify-content:center;flex:none}
.clock{font-family:var(--display);font-weight:600;font-size:24px;font-variant-numeric:tabular-nums}

.widgets{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.w{border:0;border-radius:22px;padding:16px;text-align:left;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;background:var(--surface);color:var(--ink);position:relative;overflow:hidden;width:100%}
button.w:active{transform:scale(.98)}
.w.full{grid-column:1/-1;min-height:0}
.w .wl{font-size:15px;font-weight:600;opacity:.75}
.w .big{font-family:var(--display);font-size:46px;font-weight:700;line-height:.95;font-variant-numeric:tabular-nums}
.w .big small{font-size:22px;font-weight:600}
.w .wt{font-family:var(--display);font-size:34px;font-weight:700;line-height:1.02}
.w .wt2{font-family:var(--display);font-size:24px;font-weight:600;line-height:1.08}
.w .ws{font-size:15px;opacity:.85;margin-top:4px}
.w .ws2{font-size:14px;color:var(--muted);margin-top:3px}
.w.hero{background:var(--accent);color:var(--on-accent);min-height:200px}
.w.hero .wl{opacity:.85}
.w.hero .clock{font-size:26px}
.wbtn{display:flex;align-items:center;justify-content:center;border:0;border-radius:14px;background:var(--on-accent);color:var(--accent);font-weight:700;font-size:17px;min-height:52px;width:100%}
.wlink{border:0;background:rgba(255,255,255,.18);color:inherit;border-radius:10px;padding:6px 10px;font-weight:600;font-size:14px}
.week{display:flex;gap:6px}
.wd{flex:1;aspect-ratio:1;max-width:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;background:var(--chip);color:var(--muted)}
.wd.on{background:var(--good);color:#fff}
.wd.today{box-shadow:inset 0 0 0 2px var(--ink)}
.w.wk .ws2{margin:0;font-weight:600;color:var(--ink)}
.t-food{background:var(--t-food)} .t-water{background:var(--t-water)} .t-ex{background:var(--t-ex)} .t-prog{background:var(--t-prog)}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qbtn{border:0;border-radius:14px;background:var(--surface);color:var(--ink);font-family:var(--display);font-weight:700;font-size:22px;text-align:left;padding:12px 14px;min-height:64px;line-height:1.05}
.qbtn small{display:block;font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted);margin-top:4px}
.food-w{gap:12px}
.fw-top,.fw-nums,.fw-sug{border:0;background:none;color:inherit;padding:0;text-align:left;width:100%}
.fw-top{display:flex;justify-content:space-between;align-items:center}
.fw-go{font-weight:600;font-size:14px;color:var(--accent)}
.fw-nums{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fw-nums>span{display:block}
.fw-nums .ws2{display:block}
.fw-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fw-chip{border:0;background:var(--surface);color:var(--ink);border-radius:12px;min-height:44px;font-weight:600;font-size:14px}
.fw-chip b{background:var(--heat);color:#fff;border-radius:8px;padding:1px 6px;font-size:12px;margin-left:2px}
.fw-sug{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:10px 12px;font-size:14px}
.fw-sug .dot{width:10px;height:28px;border-radius:5px;flex:none}
.flist{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto;margin-bottom:10px}
.fitem{display:flex;align-items:center;gap:10px;border:0;background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.addp{width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;flex:none}
.plate{background:var(--surface);border-radius:16px;padding:14px;margin-top:12px}
.empty-plate{border:2px dashed var(--line);background:transparent}
.prow{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.mini-sel{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface2);border-radius:8px;min-height:36px;padding:0 6px;font-size:14px}
.ptot{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;background:var(--surface2);border-radius:12px;padding:10px}
.ptot div{text-align:center}
.ptot b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.ptot span{font-size:12px;color:var(--muted)}
.plus{width:52px;height:52px;border-radius:16px;border:0;background:var(--ink);color:var(--surface);font-size:30px;font-weight:600;line-height:1;flex:none}
.wfig{width:100%;height:78px;margin:-6px 0 -8px}
.rec{padding-left:24px}
.rbar{position:absolute;left:0;top:0;bottom:0;width:8px}
.bars{display:flex;align-items:flex-end;gap:5px;height:52px}
.bars span{flex:1;background:var(--fig2);border-radius:4px 4px 2px 2px}

.pills{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;min-width:40px;height:40px;border-radius:20px;border:0;background:var(--surface);font-weight:700;font-family:var(--display);font-size:19px;color:var(--muted)}
.pill.cur{background:var(--ink);color:var(--surface)}
.pill.ok{background:var(--good);color:#fff}
.wstage{display:block;width:100%;border:0;padding:0;background:var(--surface2);position:relative}
.wstage svg{display:block;width:100%;height:170px}
.howto{position:absolute;right:10px;bottom:10px;background:var(--surface);color:var(--accent);font-weight:600;font-size:14px;padding:6px 10px;border-radius:10px}
.setcard{border:2px solid var(--accent);border-radius:16px;padding:12px;margin-top:12px}
.steps2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.slbl{font-size:13px;color:var(--muted);margin-bottom:4px}
.stepper{display:grid;grid-template-columns:38px minmax(0,1fr) 38px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface2)}
.stepper button{border:0;background:var(--chip);font-size:22px;font-weight:600;color:var(--ink)}
.stepper input{border:0;background:transparent;text-align:center;font-family:var(--display);font-size:26px;font-weight:700;min-width:0;width:100%;min-height:54px;font-variant-numeric:tabular-nums}
.stepper input:focus{outline:none;background:var(--accent-soft)}
.stepper input::placeholder{color:var(--fig2)}
.setline{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--surface2);border-radius:12px;padding:12px;margin-top:8px;text-align:left;min-height:48px}
.setline.done{background:var(--good-soft)}
.setline .sn{font-family:var(--display);font-weight:700;font-size:20px;width:22px;text-align:center;color:var(--muted)}
.setline .okc{color:var(--good);font-weight:700;font-size:18px}
.wnav{display:grid;grid-template-columns:56px 1fr;gap:8px;margin-top:4px}
.wnav .btn{min-height:54px}
.card{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:12px}
.card.flat{background:var(--surface2)}
.h2{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.1;margin:0 0 4px}
.h3{font-weight:600;font-size:16px;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.sec-title{font-family:var(--display);font-weight:600;font-size:20px;margin:22px 0 10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:8px}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--chip);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.good{background:var(--good);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:10px}
.iconbtn{border:0;background:var(--chip);width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:18px;line-height:1}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--chip);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 4px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}

.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--chip);color:var(--muted)}
.tag.casa{background:var(--good-soft);color:var(--good)}
.tag.gin{background:var(--accent-soft);color:var(--accent)}
.tag.next{background:var(--heat);color:#fff}

.input{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;min-height:44px}
.input:focus{border-color:var(--accent);outline:none}
label.lbl{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}

/* exercise list */
.exlist{display:flex;flex-direction:column;gap:8px}
.exitem{display:flex;align-items:center;gap:12px;background:var(--surface);border:0;border-radius:14px;padding:8px 12px 8px 8px;text-align:left;width:100%}
.thumb{width:64px;height:52px;flex:none;background:var(--surface2);border-radius:10px}
.exitem .nm{font-weight:600;line-height:1.2}
.exitem .meta{font-size:13px;color:var(--muted);margin-top:2px}

/* workout */
.wk-head{background:var(--ink);color:var(--surface);border-radius:16px;padding:16px;margin-bottom:12px}
.wk-head .t{font-family:var(--display);font-weight:700;font-size:30px;line-height:1}
.wk-head .clock{font-family:var(--display);font-weight:600;font-size:30px;font-variant-numeric:tabular-nums}
.sets{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 48px;gap:6px;align-items:center;margin-top:10px}
.sets .hd{font-size:12px;color:var(--muted);font-weight:500}
.sets .n{font-family:var(--display);font-weight:600;font-size:20px;text-align:center;color:var(--muted)}
.sets input{width:100%;text-align:center;border:1px solid var(--line);background:var(--surface2);border-radius:10px;min-height:44px;font-family:var(--display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.sets input:focus{border-color:var(--accent);outline:none}
.sets input::placeholder{color:var(--fig2)}
.ck{width:48px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.ck[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.done-row input{background:var(--good-soft);border-color:transparent}
.last{font-size:13px;color:var(--muted);margin-top:4px}

.rest{position:fixed;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:29;padding:0 12px 8px;pointer-events:none}
.rest .in{pointer-events:auto;max-width:536px;margin:0 auto;background:var(--accent);color:var(--on-accent);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden}
.rest .bar{position:absolute;left:0;bottom:0;height:4px;background:rgba(255,255,255,.55)}
.rest .tm{font-family:var(--display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;min-width:68px}
.rest button{border:0;background:rgba(255,255,255,.2);color:inherit;border-radius:9px;padding:8px 10px;font-weight:600}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:40;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease;max-width:560px;margin:0 auto;overscroll-behavior:contain}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet .sh-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.sheet h2{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.02;margin:0}
.stage{background:var(--surface);border-radius:16px;overflow:hidden;margin-bottom:12px;position:relative}
.viewtag{position:absolute;left:10px;top:10px;background:var(--surface2);color:var(--muted);font-size:12px;font-weight:600;padding:4px 8px;border-radius:8px}
.stage svg{display:block;width:100%;height:auto}
ol.steps{margin:6px 0 0;padding-left:22px}
ol.steps li{margin-bottom:6px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kv div{background:var(--surface);border-radius:12px;padding:10px 12px}
.kv .k{font-size:12px;color:var(--muted)}
.kv .v{font-weight:600}

/* food */
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.totals div{background:var(--surface);border-radius:14px;padding:10px 12px}
.totals .num{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.totals .k{font-size:12px;color:var(--muted)}
.slot{background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.slot .it{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.slot .it:first-of-type{border-top:0}
.recipe{display:flex;gap:12px;align-items:center;background:var(--surface);border:0;border-radius:14px;padding:12px 14px;text-align:left;width:100%;margin-bottom:8px}
.recipe .dot{width:12px;height:44px;border-radius:6px;flex:none}
.ing{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.ing:last-child{border-bottom:0}
.shop-it{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.shop-it input{width:22px;height:22px;accent-color:var(--good)}
.shop-it.got span.nm{text-decoration:line-through;color:var(--muted)}

/* progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--surface);border-radius:14px;padding:12px}
.stats .num{font-family:var(--display);font-weight:700;font-size:40px;line-height:1}
.stats .k{font-size:13px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}

.empty{background:var(--surface);border-radius:16px;padding:22px 16px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;transition:transform .25s ease;max-width:90%}
.toast.on{transform:translate(-50%,0);visibility:visible}
.toast:not(.on){visibility:hidden}
.note{font-size:13px;color:var(--muted);margin-top:8px}
details.tip{background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:12px}
details.tip summary{font-weight:600;cursor:pointer}
.mini-in{width:56px;text-align:center;border:1px solid var(--line);background:var(--surface2);border-radius:8px;min-height:36px}
.plan-ex{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.plan-ex:first-child{border-top:0}
@media (prefers-reduced-motion: reduce){ .sheet,.toast{transition:none} }
</style>
</head>
<body>
<div class="app">
  <header id="top"></header>
  <main id="main"></main>
</div>
<div class="rest" id="rest" hidden></div>
<div class="scrim" id="scrim" data-act="closeSheet"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
"use strict";
/* ======================= ANIMATION POSES ======================= */
const STAND={H:[100,20],N:[100,34],P:[100,72],K:[100,100],F:[100,127]};
const FRONTLEGS={K:[95,100],F:[93,127],K2:[105,100],F2:[107,127]};
const ROWBODY={H:[124,46],N:[110,54],P:[56,58],K:[52,80],F:[34,80],K2:[66,104],F2:[64,127],E2:[112,68],W2:[118,80]};

function fullPose(key,which){
  const def=POSES[key]||POSES.curl;
  const a={...def.A};
  const p=which==='B'?{...a,...def.B}:a;
  ['K','F','E','W'].forEach(j=>{ if(!p[j+'2']) p[j+'2']=p[j]; });
  return p;
}
const ZONE_HL={'Peito':'torso','Costas':'torso','Ombros':'arm','Bíceps':'arm','Tríceps':'arm','Pernas':'thigh','Glúteos':'thigh','Gémeos':'shin','Core':'torso','Cardio':'legs'};
function propOf(ex){
  if(ex.prop) return ex.prop;
  const e=(ex.eq||'').toLowerCase();
  if(e.includes('halter')) return 'db';
  if(e.includes('elástico')) return 'band';
  if(e.includes('cabo')||e.includes('máquina')) return 'cable';
  if(e.includes('barra')&&!e.includes('elevaç')) return 'bar';
  return '';
}
function lerp(a,b,t){return a+(b-a)*t}
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
function poseAt(key,t){
  const A=fullPose(key,'A'),B=fullPose(key,'B'),o={};
  for(const k in A){o[k]=[lerp(A[k][0],B[k][0],t),lerp(A[k][1],B[k][1],t)];}
  return o;
}
function seg(a,b,c,w,op){return `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"${op?` opacity="${op}"`:''}/>`}
function figure(ex,t){
  const key=ex.a, def=POSES[key]||POSES.curl, p=poseAt(key,t);
  const hl=ex.hl||ZONE_HL[ex.z]||'torso', prop=propOf(ex), front=!!def.front;
  const F='var(--fig)',F2=front?'var(--fig)':'var(--fig2)',HC='var(--heat)';
  let s=def.nofloor?'':`<line x1="10" y1="129" x2="190" y2="129" stroke="var(--line)" stroke-width="2"/>`;
  if(def.bench){const[x,y,w]=def.bench;s+=`<rect x="${x}" y="${y}" width="${w}" height="7" rx="3" fill="var(--fig2)"/><line x1="${x+10}" y1="${y+7}" x2="${x+10}" y2="129" stroke="var(--fig2)" stroke-width="4"/><line x1="${x+w-10}" y1="${y+7}" x2="${x+w-10}" y2="129" stroke="var(--fig2)" stroke-width="4"/>`;}
  if(def.extra) s+=def.extra;
  if(def.dyn) s+=def.dyn(p,t);
  if(prop==='band'||(prop==='cable'&&def.band)){
    const anc=def.band||[100,129];
    const col=prop==='band'?HC:'var(--fig2)';
    s+=seg(anc,p.W,col,2,prop==='band'?.7:1);
    if(front) s+=seg(anc,p.W2,col,2,prop==='band'?.7:1);
  }
  // back limbs
  s+=seg(p.P,p.K2,F2,7)+seg(p.K2,p.F2,F2,7)+seg(p.N,p.E2,F2,6)+seg(p.E2,p.W2,F2,6);
  // torso + front limbs
  s+=seg(p.N,p.P,F,12)+seg(p.P,p.K,F,7)+seg(p.K,p.F,F,7)+seg(p.N,p.E,F,6)+seg(p.E,p.W,F,6);
  // highlight
  if(hl==='torso') s+=seg(p.N,p.P,HC,8,.9);
  if(hl==='arm'){ s+=seg(p.N,p.E,HC,5,.95); if(front) s+=seg(p.N,p.E2,HC,5,.95); }
  if(hl==='thigh'){ s+=seg(p.P,p.K,HC,5,.95); if(front) s+=seg(p.P,p.K2,HC,5,.95); }
  if(hl==='shin'){ s+=seg(p.K,p.F,HC,5,.95); s+=seg(p.K2,p.F2,HC,5,.6); }
  if(hl==='legs'){ s+=seg(p.P,p.K,HC,5,.9)+seg(p.K,p.F,HC,5,.9)+seg(p.P,p.K2,HC,5,.6)+seg(p.K2,p.F2,HC,5,.6); }
  s+=`<circle cx="${p.H[0].toFixed(1)}" cy="${p.H[1].toFixed(1)}" r="9" fill="${F}"/>`;
  const dbAt=w=>`<g transform="translate(${w[0].toFixed(1)} ${w[1].toFixed(1)})"><rect x="-9" y="-1.5" width="18" height="3" rx="1.5" fill="var(--ink)"/><rect x="-12" y="-5" width="5" height="10" rx="1.5" fill="var(--ink)"/><rect x="7" y="-5" width="5" height="10" rx="1.5" fill="var(--ink)"/></g>`;
  if(prop==='db'){ s+=dbAt(p.W); if(front) s+=dbAt(p.W2); }
  if(prop==='dbv'){ s+=`<g transform="translate(${p.W[0].toFixed(1)} ${p.W[1].toFixed(1)})"><rect x="-1.5" y="-9" width="3" height="18" rx="1.5" fill="var(--ink)"/><rect x="-5" y="-12" width="10" height="5" rx="1.5" fill="var(--ink)"/><rect x="-5" y="7" width="10" height="5" rx="1.5" fill="var(--ink)"/></g>`; }
  if(prop==='bar2'){ const x1=Math.min(p.W[0],p.W2[0])-16,x2=Math.max(p.W[0],p.W2[0])+16,y=((p.W[1]+p.W2[1])/2).toFixed(1); s+=`<line x1="${x1.toFixed(1)}" y1="${y}" x2="${x2.toFixed(1)}" y2="${y}" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round"/><rect x="${(x1-3).toFixed(1)}" y="${(+y-8).toFixed(1)}" width="6" height="16" rx="2" fill="var(--ink)"/><rect x="${(x2-3).toFixed(1)}" y="${(+y-8).toFixed(1)}" width="6" height="16" rx="2" fill="var(--ink)"/>`; }
  if(prop==='bar'){ s+=`<circle cx="${p.W[0].toFixed(1)}" cy="${p.W[1].toFixed(1)}" r="9" fill="none" stroke="var(--ink)" stroke-width="4"/>`; }
  return s;
}

 {id:'aberturas',n:'Aberturas com halteres',z:'Peito',s:'Ombro frontal',p:'ambos',eq:'Halteres + banco',lv:'Intermédio',a:'flytop',st:['Deitado no banco, halteres em cima do peito, palmas viradas uma para a outra.','Cotovelos ligeiramente dobrados, sempre no mesmo ângulo.','Abre os braços para os lados até sentires o peito a esticar.','Volta a fechar como se abraçasses uma árvore.'],er:'Usar peso a mais, esticar os braços por completo, descer demasiado.'},
 {id:'flexoes',n:'Flexões',z:'Peito',s:'Tríceps, core',p:'ambos',eq:'Peso do corpo',lv:'Iniciante',a:'pushup',st:['Mãos no chão um pouco mais abertas que os ombros.','Corpo em linha reta da cabeça aos pés, barriga contraída.','Desce até o peito quase tocar no chão.','Empurra o chão para voltar acima.'],er:'Anca a cair ou levantada, cotovelos muito abertos, meia repetição.'},
 {id:'flexoes-inclinadas',n:'Flexões inclinadas no banco',z:'Peito',s:'Tríceps, core',p:'casa',eq:'Banco',lv:'Iniciante',a:'inclinepush',st:['Mãos na beira do banco, corpo em linha reta.','Desce o peito até ao banco.','Empurra para voltar acima.','Quando ficar fácil, passa para flexões no chão.'],er:'Anca dobrada, pescoço esticado para a frente.'},
 {id:'press-elastico',n:'Press de peito com elástico',z:'Peito',s:'Tríceps',p:'casa',eq:'Elástico',lv:'Iniciante',a:'pushfwd',st:['Prende o elástico atrás de ti à altura do peito.','Pega numa ponta com cada mão, um pé à frente.','Empurra as mãos para a frente até esticar os braços.','Volta devagar a controlar o elástico.'],er:'Deixar o elástico puxar de repente, curvar as costas.'},
 {id:'supino-barra',n:'Supino com barra',z:'Peito',s:'Tríceps, ombro frontal',p:'gin',eq:'Barra + banco',lv:'Intermédio',a:'bench',st:['Deitado, olhos por baixo da barra, mãos um pouco mais abertas que os ombros.','Tira a barra do suporte com os braços esticados.','Desce até tocar ao de leve no peito.','Empurra para cima até esticar os braços.'],er:'Fazer ressaltar a barra no peito, treinar pesado sem alguém a ajudar.'},
 {id:'peck-deck',n:'Máquina de aberturas (peck deck)',z:'Peito',s:'Ombro frontal',p:'gin',eq:'Máquina',lv:'Iniciante',a:'peckfront',st:['Ajusta o banco para as pegas ficarem à altura do peito.','Costas encostadas, cotovelos ligeiramente dobrados.','Junta as pegas à frente do peito.','Abre devagar até sentir o peito a esticar.'],er:'Afastar as costas do encosto, deixar o peso bater.'},

 {id:'remada-halter',n:'Remada com halter no banco',z:'Costas',s:'Bíceps, ombro posterior',p:'ambos',eq:'Halter + banco',lv:'Iniciante',a:'row',st:['Joelho e mão do mesmo lado apoiados no banco, costas direitas.','Halter na outra mão, braço esticado para o chão.','Puxa o halter até à anca, cotovelo junto ao corpo.','Aperta as costas 1 segundo em cima e desce devagar.'],er:'Rodar o tronco para subir o peso, arredondar as costas, puxar só com o braço.'},
 {id:'remada-elastico',n:'Remada sentada com elástico',z:'Costas',s:'Bíceps',p:'casa',eq:'Elástico',lv:'Iniciante',a:'seatedrow',st:['Senta-te no chão com as pernas esticadas e o elástico à volta dos pés.','Costas direitas, braços esticados à frente.','Puxa as mãos até à barriga, cotovelos para trás.','Aperta as omoplatas e volta devagar.'],er:'Inclinar o tronco para trás para ajudar, encolher os ombros.'},
 {id:'puxada-elastico',n:'Puxada com elástico',z:'Costas',s:'Bíceps',p:'casa',eq:'Elástico preso em cima',lv:'Iniciante',a:'pulldown',st:['Prende o elástico no alto de uma porta (com âncora de porta).','De joelhos ou sentado, braços esticados para cima.','Puxa os cotovelos para baixo e para os lados do corpo.','Volta devagar até esticar os braços.'],er:'Puxar com os braços em vez das costas, dobrar o tronco para trás.'},
 {id:'pullover',n:'Pullover com halter',z:'Costas',s:'Peito, tríceps',p:'ambos',eq:'Halter + banco',lv:'Intermédio',a:'pullover',st:['Deitado no banco, segura um halter com as duas mãos em cima do peito.','Cotovelos ligeiramente dobrados.','Leva o halter para trás da cabeça até sentires esticar.','Volta à posição inicial com os braços.'],er:'Dobrar os cotovelos a meio, usar peso a mais, arquear a lombar.'},
 {id:'superman',n:'Superman',z:'Costas',s:'Glúteos, lombar',p:'ambos',eq:'Peso do corpo',lv:'Iniciante',a:'superman',st:['Deita-te de barriga para baixo, braços esticados à frente.','Levanta ao mesmo tempo braços, peito e pernas.','Segura 2 segundos em cima.','Desce devagar.'],er:'Atirar o corpo para cima, levantar a cabeça demasiado.'},
 {id:'elevacoes',n:'Elevações na barra',z:'Costas',s:'Bíceps',p:'gin',eq:'Barra de elevações',lv:'Intermédio',a:'pullup',st:['Pendura-te com as mãos um pouco mais abertas que os ombros.','Puxa o corpo até o queixo passar a barra.','Desce até esticar os braços.','Se ainda não consegues, usa um elástico de ajuda.'],er:'Balançar o corpo, fazer só meia descida.'},
 {id:'puxada-maquina',n:'Puxada à frente na máquina',z:'Costas',s:'Bíceps',p:'gin',eq:'Máquina',lv:'Iniciante',a:'pulldown',st:['Senta-te com as coxas presas pelo apoio.','Pega na barra mais aberta que os ombros.','Puxa até à parte de cima do peito.','Sobe devagar até esticar os braços.'],er:'Puxar para trás da nuca, inclinar muito o tronco.'},
 {id:'remada-cabo',n:'Remada sentada no cabo',z:'Costas',s:'Bíceps',p:'gin',eq:'Cabo',lv:'Iniciante',a:'seatedrow',st:['Pés no apoio, joelhos ligeiramente dobrados.','Costas direitas, braços esticados.','Puxa a pega até à barriga.','Volta devagar sem arredondar as costas.'],er:'Balançar o tronco, encolher os ombros.'},
 {id:'peso-morto',n:'Peso morto com barra',z:'Costas',s:'Pernas, glúteos',p:'gin',eq:'Barra',lv:'Intermédio',a:'hinge',hl:'torso',st:['Pés à largura da anca, barra junto às canelas.','Costas direitas, peito para fora.','Levanta empurrando o chão com os pés, barra sempre junto ao corpo.','Desce levando a anca para trás.'],er:'Arredondar as costas, afastar a barra do corpo.'},

 {id:'press-ombros',n:'Press de ombros com halteres',z:'Ombros',s:'Tríceps',p:'ambos',eq:'Halteres + banco',lv:'Iniciante',a:'pressfront',st:['Sentado no banco com encosto, halteres à altura dos ombros.','Palmas viradas para a frente.','Empurra para cima até quase esticar os braços.','Desce devagar até à altura das orelhas.'],er:'Arquear a lombar, bater os halteres em cima.'},
 {id:'elev-laterais',n:'Elevações laterais',z:'Ombros',s:'Trapézio',p:'ambos',eq:'Halteres',lv:'Iniciante',a:'lateral',st:['De pé, halteres ao lado do corpo.','Cotovelos ligeiramente dobrados.','Levanta os braços para os lados até à altura dos ombros.','Desce devagar.'],er:'Usar peso a mais e balançar, subir acima dos ombros, encolher os ombros.'},
 {id:'elev-frontais',n:'Elevações frontais',z:'Ombros',s:'Peito (parte de cima)',p:'ambos',eq:'Halteres',lv:'Iniciante',a:'frontraise',st:['De pé, halteres à frente das coxas.','Levanta um braço (ou os dois) à frente até à altura dos ombros.','Segura 1 segundo.','Desce devagar.'],er:'Balançar o corpo, subir demasiado alto.'},
 {id:'face-pull',n:'Face pull com elástico',z:'Ombros',s:'Costas (trapézio)',p:'casa',eq:'Elástico',lv:'Iniciante',a:'facepull',hl:'arm',st:['Prende o elástico à frente, à altura da cara.','Pega com as duas mãos, braços esticados.','Puxa em direção à cara, abrindo os cotovelos para os lados.','Volta devagar.'],er:'Puxar para o peito em vez da cara, encolher os ombros.'},
 {id:'pike',n:'Pike push-ups',z:'Ombros',s:'Tríceps',p:'ambos',eq:'Peso do corpo',lv:'Intermédio',a:'pike',st:['Faz um V invertido: mãos e pés no chão, anca bem alta.','Dobra os cotovelos e leva a cabeça em direção ao chão.','Empurra para voltar acima.','Mais perto os pés das mãos = mais difícil.'],er:'Baixar a anca e transformar em flexão normal.'},
 {id:'press-maquina',n:'Press de ombros na máquina',z:'Ombros',s:'Tríceps',p:'gin',eq:'Máquina',lv:'Iniciante',a:'pressfront',st:['Ajusta o banco para as pegas ficarem à altura dos ombros.','Costas encostadas.','Empurra para cima.','Desce devagar.'],er:'Afastar as costas do encosto.'},

 {id:'curl-halteres',n:'Curl com halteres',z:'Bíceps',s:'Antebraço',p:'ambos',eq:'Halteres',lv:'Iniciante',a:'curlfront',st:['De pé, halteres ao lado do corpo, palmas para a frente.','Cotovelos colados ao corpo.','Sobe os halteres até aos ombros.','Desce devagar até esticar os braços.'],er:'Balançar o corpo, mexer os cotovelos para a frente.'},
 {id:'curl-martelo',n:'Curl martelo',z:'Bíceps',s:'Antebraço',p:'ambos',eq:'Halteres',lv:'Iniciante',a:'curl',prop:'dbv',st:['Halteres ao lado do corpo, palmas viradas uma para a outra.','Cotovelos parados.','Sobe os halteres mantendo as palmas viradas para dentro.','Desce devagar.'],er:'Rodar o pulso, usar balanço.'},
 {id:'curl-concentrado',n:'Curl concentrado',z:'Bíceps',s:'',p:'ambos',eq:'Halter + banco',lv:'Iniciante',a:'curlconc',st:['Sentado no banco, cotovelo apoiado na parte de dentro da coxa.','Braço esticado com o halter.','Sobe até ao ombro e aperta o bíceps.','Desce devagar.'],er:'Levantar o cotovelo da coxa, ir depressa.'},
 {id:'curl-elastico',n:'Curl com elástico',z:'Bíceps',s:'Antebraço',p:'casa',eq:'Elástico',lv:'Iniciante',a:'curl',st:['Pisa o meio do elástico, uma ponta em cada mão.','Cotovelos junto ao corpo.','Sobe as mãos até aos ombros.','Desce devagar a controlar o elástico.'],er:'Deixar o elástico puxar de repente para baixo.'},
 {id:'curl-barra',n:'Curl com barra',z:'Bíceps',s:'Antebraço',p:'gin',eq:'Barra',lv:'Iniciante',a:'curlfront',prop:'bar2',st:['De pé, barra à frente das coxas, palmas para a frente.','Cotovelos junto ao corpo.','Sobe a barra até ao peito.','Desce devagar.'],er:'Balançar as costas para levantar o peso.'},
 {id:'curl-cabo',n:'Curl no cabo',z:'Bíceps',s:'',p:'gin',eq:'Cabo',lv:'Iniciante',a:'curlcable',st:['Pega na barra do cabo baixo.','Cotovelos parados junto ao corpo.','Sobe até ao peito.','Desce devagar.'],er:'Inclinar o corpo para trás.'},

 {id:'ext-cabeca',n:'Extensão acima da cabeça com halter',z:'Tríceps',s:'',p:'ambos',eq:'Halter',lv:'Iniciante',a:'ohext',st:['Sentado ou de pé, segura um halter com as duas mãos acima da cabeça.','Cotovelos apontados para a frente.','Desce o halter atrás da cabeça.','Estica os braços para voltar acima.'],er:'Abrir os cotovelos para os lados, arquear as costas.'},
 {id:'kickback',n:'Kickback de tríceps',z:'Tríceps',s:'',p:'ambos',eq:'Halter + banco',lv:'Iniciante',a:'kickback',st:['Apoia um joelho e uma mão no banco, costas direitas.','Cotovelo colado ao corpo, braço dobrado a 90°.','Estica o braço para trás.','Volta devagar a 90°.'],er:'Mexer o cotovelo, balançar o halter.'},
 {id:'fundos-banco',n:'Fundos no banco',z:'Tríceps',s:'Peito, ombros',p:'ambos',eq:'Banco',lv:'Iniciante',a:'dips',st:['Mãos na beira do banco, atrás de ti.','Pernas à frente (dobradas é mais fácil).','Dobra os cotovelos e desce a anca.','Empurra para subir.'],er:'Descer demasiado e forçar os ombros, abrir os cotovelos.'},
 {id:'ext-elastico',n:'Extensão de tríceps com elástico',z:'Tríceps',s:'',p:'casa',eq:'Elástico preso em cima',lv:'Iniciante',a:'pushdown',st:['Prende o elástico no alto de uma porta.','Cotovelos colados ao corpo.','Empurra as mãos para baixo até esticar os braços.','Sobe devagar até 90°.'],er:'Afastar os cotovelos do corpo, inclinar o tronco.'},
 {id:'flexoes-diamante',n:'Flexões diamante',z:'Tríceps',s:'Peito',p:'ambos',eq:'Peso do corpo',lv:'Intermédio',a:'pushup',hl:'arm',st:['Mãos juntas debaixo do peito, a formar um diamante.','Corpo em linha reta.','Desce mantendo os cotovelos junto ao corpo.','Empurra para subir.'],er:'Anca a cair, cotovelos a abrir.'},
 {id:'pushdown-cabo',n:'Extensão de tríceps no cabo',z:'Tríceps',s:'',p:'gin',eq:'Cabo',lv:'Iniciante',a:'pushdown',st:['De frente para o cabo alto, pega na corda ou barra.','Cotovelos colados ao corpo.','Empurra para baixo até esticar.','Sobe devagar.'],er:'Usar o peso do corpo para empurrar.'},

 {id:'agachamento-goblet',n:'Agachamento goblet',z:'Pernas',s:'Glúteos, core',p:'ambos',eq:'Halter',lv:'Iniciante',a:'squat',st:['Segura um halter na vertical junto ao peito.','Pés à largura dos ombros, pontas ligeiramente para fora.','Desce como se te fosses sentar, peito para cima.','Sobe empurrando o chão com os calcanhares.'],er:'Joelhos a fugirem para dentro, levantar os calcanhares, arredondar as costas.'},
 {id:'bulgaro',n:'Agachamento búlgaro',z:'Pernas',s:'Glúteos',p:'ambos',eq:'Halteres + banco',lv:'Intermédio',a:'bulgarian',st:['Põe o pé de trás em cima do banco.','Pé da frente um passo grande à frente.','Desce até a coxa da frente ficar paralela ao chão.','Sobe pela perna da frente.'],er:'Pé da frente demasiado perto do banco, joelho a fugir para dentro.'},
 {id:'lunges',n:'Lunges (afundos)',z:'Pernas',s:'Glúteos',p:'ambos',eq:'Halteres',lv:'Iniciante',a:'lunge',st:['De pé, halteres ao lado do corpo.','Dá um passo grande à frente.','Desce até os dois joelhos ficarem a 90°.','Empurra com a perna da frente para voltar.'],er:'Passo curto demais, tronco a cair para a frente.'},
 {id:'step-up',n:'Step-up no banco',z:'Pernas',s:'Glúteos',p:'casa',eq:'Banco + halteres',lv:'Iniciante',a:'stepup',st:['De frente para o banco, um pé em cima.','Sobe empurrando com a perna de cima.','Desce devagar com a mesma perna.','Faz todas as repetições de um lado e troca.'],er:'Dar impulso com a perna de baixo, banco instável.'},
 {id:'rdl',n:'Peso morto romeno com halteres',z:'Pernas',s:'Glúteos, lombar',p:'ambos',eq:'Halteres',lv:'Iniciante',a:'hinge',st:['De pé, halteres à frente das coxas.','Joelhos ligeiramente dobrados e parados.','Leva a anca para trás e desce os halteres junto às pernas.','Sobe quando sentires a parte de trás da coxa a esticar.'],er:'Arredondar as costas, dobrar demasiado os joelhos.'},
 {id:'leg-press',n:'Leg press',z:'Pernas',s:'Glúteos',p:'gin',eq:'Máquina',lv:'Iniciante',a:'legpress',st:['Costas encostadas, pés à largura dos ombros na plataforma.','Desbloqueia e desce até os joelhos ficarem a 90°.','Empurra sem esticar totalmente os joelhos.','Volta a bloquear no fim.'],er:'Tirar a anca do banco, bloquear os joelhos em cima.'},
 {id:'extensao-pernas',n:'Extensão de pernas',z:'Pernas',s:'',p:'gin',eq:'Máquina',lv:'Iniciante',a:'seated',st:['Senta-te com o rolo à frente dos tornozelos.','Estica as pernas até à frente.','Segura 1 segundo.','Desce devagar.'],er:'Usar balanço, levantar a anca do banco.'},
 {id:'agachamento-barra',n:'Agachamento com barra',z:'Pernas',s:'Glúteos, core',p:'gin',eq:'Barra',lv:'Intermédio',a:'squat',st:['Barra apoiada na parte de cima das costas.','Pés à largura dos ombros.','Desce até as coxas ficarem paralelas ao chão.','Sobe empurrando o chão.'],er:'Joelhos para dentro, costas arredondadas.'},

 {id:'hip-thrust',n:'Hip thrust no banco',z:'Glúteos',s:'Posterior da coxa',p:'ambos',eq:'Halter + banco',lv:'Iniciante',a:'thrust',st:['Costas apoiadas na beira do banco, halter em cima da anca.','Pés no chão, joelhos dobrados.','Sobe a anca até o corpo ficar em linha reta.','Aperta os glúteos em cima e desce devagar.'],er:'Arquear a lombar em vez de usar os glúteos.'},
 {id:'ponte',n:'Ponte de glúteos',z:'Glúteos',s:'Posterior da coxa',p:'casa',eq:'Peso do corpo',lv:'Iniciante',a:'bridge',st:['Deitado de costas, joelhos dobrados, pés no chão.','Sobe a anca até ficar em linha com os joelhos.','Aperta os glúteos 2 segundos.','Desce devagar.'],er:'Empurrar com a lombar, pés demasiado longe.'},
 {id:'abducao-elastico',n:'Abdução com elástico',z:'Glúteos',s:'',p:'casa',eq:'Elástico',lv:'Iniciante',a:'abduct',st:['Elástico à volta dos tornozelos ou acima dos joelhos.','De pé, apoiado numa cadeira.','Leva uma perna para o lado.','Volta devagar e troca de perna no fim.'],er:'Inclinar o tronco para o lado.'},
 {id:'coice-gluteo',n:'Coice de glúteo',z:'Glúteos',s:'',p:'casa',eq:'Elástico',lv:'Iniciante',a:'gkick',st:['De quatro no chão, mãos debaixo dos ombros.','Leva uma perna para trás e para cima.','Aperta o glúteo em cima.','Volta devagar e troca de perna no fim.'],er:'Arquear a lombar, rodar a anca.'},
 {id:'abducao-maquina',n:'Abdução na máquina',z:'Glúteos',s:'',p:'gin',eq:'Máquina',lv:'Iniciante',a:'abductseat',st:['Senta-te com os apoios do lado de fora dos joelhos.','Abre as pernas.','Segura 1 segundo.','Fecha devagar.'],er:'Deixar o peso bater.'},

 {id:'gemeos',n:'Elevação de gémeos com halteres',z:'Gémeos',s:'',p:'ambos',eq:'Halteres',lv:'Iniciante',a:'calf',st:['De pé, halteres ao lado do corpo.','Sobe para a ponta dos pés o mais alto possível.','Segura 1 segundo.','Desce devagar.'],er:'Ir depressa, dobrar os joelhos.'},
 {id:'gemeos-sentado',n:'Gémeos sentado na máquina',z:'Gémeos',s:'',p:'gin',eq:'Máquina',lv:'Iniciante',a:'seatedcalf',st:['Senta-te com o apoio em cima dos joelhos.','Pontas dos pés na plataforma.','Sobe os calcanhares ao máximo.','Desce devagar.'],er:'Fazer só meio movimento.'},

 {id:'prancha',n:'Prancha',z:'Core',s:'Ombros, glúteos',p:'ambos',eq:'Peso do corpo',lv:'Iniciante',a:'plank',tm:1,st:['Antebraços no chão, cotovelos debaixo dos ombros.','Corpo em linha reta da cabeça aos pés.','Aperta a barriga e os glúteos.','Segura o tempo indicado a respirar normalmente.'],er:'Anca a cair ou demasiado alta, prender a respiração.'},
 {id:'crunch',n:'Crunch',z:'Core',s:'',p:'ambos',eq:'Peso do corpo',lv:'Iniciante',a:'crunch',st:['Deitado de costas, joelhos dobrados.','Mãos junto à cabeça sem puxar o pescoço.','Sobe os ombros do chão contraindo a barriga.','Desce devagar.'],er:'Puxar a cabeça com as mãos, subir com balanço.'},
 {id:'crunch-banco',n:'Crunch no banco',z:'Core',s:'',p:'casa',eq:'Banco',lv:'Iniciante',a:'benchcrunch',st:['Deitado no banco, pés apoiados.','Mãos junto à cabeça.','Sobe os ombros contraindo a barriga.','Desce devagar sem relaxar por completo.'],er:'Puxar o pescoço.'},
 {id:'elev-pernas',n:'Elevação de pernas',z:'Core',s:'',p:'ambos',eq:'Peso do corpo',lv:'Iniciante',a:'legraise',st:['Deitado de costas, mãos ao lado do corpo ou debaixo da anca.','Pernas esticadas (dobradas é mais fácil).','Sobe as pernas até ficarem na vertical.','Desce devagar sem tocar no chão.'],er:'Lombar a levantar do chão, descer depressa.'},
 {id:'russian-twist',n:'Russian twist',z:'Core',s:'Oblíquos',p:'ambos',eq:'Halter',lv:'Iniciante',a:'twistfront',st:['Sentado, joelhos dobrados, tronco um pouco inclinado para trás.','Segura um halter com as duas mãos.','Roda o tronco e leva o halter a um lado.','Roda para o outro lado. Cada lado conta 1.'],er:'Mexer só os braços, arredondar as costas.'},
 {id:'mountain-climbers',n:'Mountain climbers',z:'Core',s:'Cardio, ombros',p:'ambos',eq:'Peso do corpo',lv:'Iniciante',a:'climber',tm:1,st:['Posição de flexão com braços esticados.','Leva um joelho ao peito.','Troca de perna rapidamente.','Mantém a anca baixa.'],er:'Levantar muito a anca.'},
 {id:'prancha-lateral',n:'Prancha lateral',z:'Core',s:'Oblíquos',p:'ambos',eq:'Peso do corpo',lv:'Iniciante',a:'sideplank',tm:1,st:['De lado, apoiado num antebraço.','Sobe a anca até o corpo ficar em linha reta.','Segura o tempo indicado.','Troca de lado.'],er:'Deixar a anca descer.'},

function plateTotals(items){

function freshState(){
  const plans=TPL.map(t=>({...clone(t),id:uid('p')}));
  return {v:1,updatedAt:0,tplSeen:TPL.map(t=>t.tpl),plans,activePlan:plans[0].id,current:null,food:{},shop:{sel:{},got:{}},settings:{rest:90},deleted:[],myFoods:[],myPlates:[],recentFoods:[]};
}
function normalize(s){
  const f=freshState();
  if(!s||typeof s!=='object') return f;
  const o={...f,...s};
  if(!Array.isArray(o.plans)) o.plans=f.plans;
  o.food=o.food||{}; o.myFoods=o.myFoods||[]; o.myPlates=o.myPlates||[]; o.recentFoods=o.recentFoods||[]; o.shop=o.shop||{sel:{},got:{}}; o.shop.sel=o.shop.sel||{}; o.shop.got=o.shop.got||{};
  o.settings={rest:90,...(o.settings||{})}; o.deleted=o.deleted||[];
  if(!Array.isArray(s.tplSeen)) o.tplSeen=Array.isArray(s.plans)?['p4','p3','ini','cardio']:TPL.map(t=>t.tpl);
  TPL.forEach(t=>{ if(!o.tplSeen.includes(t.tpl)){ if(!o.plans.find(p=>p.tpl===t.tpl)) o.plans.push({...clone(t),id:uid('p')}); o.tplSeen.push(t.tpl); } });
  o.plans.forEach(p=>{ const t=TPL.find(x=>x.tpl===p.tpl); if(t){ if(t.quick&&p.quick==null) p.quick=1; if(t.rest&&p.rest==null) p.rest=t.rest; } });
  if(!o.plans.find(p=>p.id===o.activePlan)) o.activePlan=o.plans[0]?o.plans[0].id:null;
  return o;
}

function q(fn){chain=chain.then(fn).catch(e=>console.warn('sync',e));return chain}
function stateRef(){return remote.db.doc('data/users/'+remote.uid+'/state')}
function sessCol(){return stateRef().collection('sessions')}

async function initRemote(){
  try{
    if(!window.claude||typeof window.claude.use!=='function') return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    remote={db,uid:id};
    const snap=await stateRef().get();
    if(snap.exists){
      const r=snap.data()||{};
      if((r.updatedAt||0)>(S.updatedAt||0)&&r.json){ try{ S=normalize(JSON.parse(r.json)); lsSet(LS_STATE,S);}catch(e){} }
      else if((S.updatedAt||0)>(r.updatedAt||0)) q(()=>stateRef().set({updatedAt:S.updatedAt,json:JSON.stringify(S)}));
    } else if(S.updatedAt){ q(()=>stateRef().set({updatedAt:S.updatedAt,json:JSON.stringify(S)})); }
    const qs=await sessCol().limit(1000).get();
    const have=new Set(SESS.map(s=>s.id)), remoteIds=new Set();
    qs.docs.forEach(d=>{ const v=d.data(); if(!v||!v.json) return; try{ const s=JSON.parse(v.json); remoteIds.add(s.id); if(!have.has(s.id)&&!S.deleted.includes(s.id)) SESS.push(s);}catch(e){} });
    SESS.forEach(s=>{ if(!remoteIds.has(s.id)) q(()=>sessCol().doc(s.id).set({date:s.date,json:JSON.stringify(s)})); });
    sortSess(); lsSet(LS_SESS,SESS);
    syncLabel='Sincronizado com a tua conta: os dados aparecem em qualquer dispositivo.';
    render();
  }catch(e){ console.warn(e); remote=null; }
}

/* ======================= ANIMAÇÕES ======================= */
function animate(elId,getEx,period){
  stopAnim(elId);
  const el=document.getElementById(elId); if(!el) return;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){ el.innerHTML=figure(getEx(0),1); return; }
  const T=period||3200, t0=performance.now();
  const loop=now=>{
    const node=document.getElementById(elId); if(!node){ RAF[elId]=null; return; }
    const el2=Math.max(0,now-t0), cycle=Math.floor(el2/T), x=(el2%T)/T; let t;
    if(x<.38) t=ease(x/.38); else if(x<.5) t=1; else if(x<.94) t=1-ease((x-.5)/.44); else t=0;
    node.innerHTML=figure(getEx(cycle),t);
    RAF[elId]=requestAnimationFrame(loop);
  };
  RAF[elId]=requestAnimationFrame(loop);
}
function stopAnim(id){ if(RAF[id]){ cancelAnimationFrame(RAF[id]); RAF[id]=null; } }
function runAnim(ex){ animate('anim',()=>ex); }

function startRest(sec){ restTotal=sec; restEnd=Date.now()+sec*1000; clearInterval(restT); drawRest(); restT=setInterval(drawRest,250); }

function drawRest(){
  const r=document.getElementById('rest'); const left=Math.max(0,Math.ceil((restEnd-Date.now())/1000));
  if(left<=0){ stopRest(); try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){} toast('Descanso terminado, próxima série!'); return; }
  const pct=(1-(restEnd-Date.now())/(restTotal*1000))*100;
  r.hidden=false;
  r.innerHTML=`<div class="in"><div><div class="small" style="opacity:.8">Descanso</div><div class="tm">${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</div></div><div class="grow"></div><button data-act="restAdd">+15 s</button><button data-act="restSkip">Saltar</button><div class="bar" style="width:${pct.toFixed(1)}%"></div></div>`;
}

function exHistory(exId){
  const out=[];
  SESS.forEach(s=>{ const it=s.items.find(i=>i.ex===exId); if(!it) return; let best=null; it.sets.forEach(x=>{const w=num(x.w); if(w!=null&&(best==null||w>best)) best=w;}); out.push({date:s.date,best,sets:it.sets}); });
  return out;
}
function lineChart(points,unit){
  if(points.length<2) return '';
  const W=320,H=140,pl=34,pr=10,pt=12,pb=24;
  const ys=points.map(p=>p.y); let mn=Math.min(...ys),mx=Math.max(...ys); if(mn===mx){mn-=1;mx+=1;}
  const X=i=>pl+(W-pl-pr)*i/(points.length-1), Y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  let d=points.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ');
  let g=`<line x1="${pl}" y1="${Y(mx)}" x2="${W-pr}" y2="${Y(mx)}" stroke="var(--line)"/><line x1="${pl}" y1="${Y(mn)}" x2="${W-pr}" y2="${Y(mn)}" stroke="var(--line)"/>`;
  g+=`<text x="${pl-6}" y="${Y(mx)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtNum(mx)}</text><text x="${pl-6}" y="${Y(mn)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtNum(mn)}</text>`;
  g+=`<text x="${pl}" y="${H-6}" font-size="11" fill="var(--muted)">${esc(points[0].l)}</text><text x="${W-pr}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--muted)">${esc(points[points.length-1].l)}</text>`;
  g+=`<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`+points.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.5" fill="var(--accent)"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução do peso em ${unit}">${g}</svg>`;
}

function fmtQty(q,u){
  if(q==null) return '';

  if(u==='ml'&&q>=1000) return fmtNum(q/1000)+' l';
  if(u==='un') return fmtNum(q);
  return fmtNum(q)+' '+u;
}

/* ---------- PROGRESSO ---------- */
function viewProgresso(){
  const now=new Date(), mStart=new Date(now.getFullYear(),now.getMonth(),1);
  const wd=(now.getDay()+6)%7, wStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()-wd);
  const inM=SESS.filter(s=>new Date(s.date)>=mStart).length, inW=SESS.filter(s=>new Date(s.date)>=wStart).length;
  let h=`<div class="stats"><div><div class="num">${inW}</div><div class="k">esta semana</div></div><div><div class="num">${inM}</div><div class="k">este mês</div></div><div><div class="num">${SESS.length}</div><div class="k">no total</div></div></div>`;
  const done=[...new Set(SESS.flatMap(s=>s.items.map(i=>i.ex)))].filter(id=>EXM[id]);
  h+=`<div class="sec-title">Evolução por exercício</div>`;
  if(!done.length) h+=`<div class="empty">Faz o primeiro treino e a evolução dos pesos aparece aqui.</div>`;
  else{
    if(!UI.progEx||!done.includes(UI.progEx)) UI.progEx=done[0];
    const hist=exHistory(UI.progEx), pts=hist.filter(x=>x.best!=null).slice(0,20).reverse().map(x=>({y:x.best,l:fmtDate(x.date).split(', ')[1]}));
    h+=`<div class="card"><select class="input" data-in="progEx" aria-label="Exercício">${done.map(id=>`<option value="${id}" ${id===UI.progEx?'selected':''}>${esc(EXM[id].n)}</option>`).join('')}</select><div style="margin-top:10px">${pts.length>1?lineChart(pts,'kg')+'<div class="small muted">Peso mais alto em cada treino (kg)</div>':'<div class="small muted">Precisas de pelo menos 2 treinos com peso registado para ver o gráfico.</div>'}</div></div>`;
  }
  h+=`<div class="sec-title">Histórico</div>`;
  if(!SESS.length) h+=`<div class="empty">Ainda não há treinos guardados.</div>`;
  SESS.slice(0,40).forEach(s=>{
    const open=UI.openSess===s.id;
    h+=`<div class="card"><button class="row between" style="width:100%;background:none;border:0;padding:0;text-align:left" data-act="toggleSess" data-id="${s.id}"><div><div class="h3">${esc(s.dayName)}</div><div class="small muted">${fmtDate(s.date)}${s.dur?`, ${s.dur} min`:''}, ${s.items.length} exercícios</div></div><span class="muted">${open?'▴':'▾'}</span></button>`;
    if(open){ h+=`<div style="margin-top:10px">${s.items.map(i=>`<div class="ing"><span>${esc(EXM[i.ex]?EXM[i.ex].n:i.ex)}</span><span class="muted small" style="text-align:right">${esc(setsTxt(i.sets))}</span></div>`).join('')}</div><button class="btn sm danger" style="margin-top:10px" data-act="delSess" data-id="${s.id}">Apagar treino</button>`; }
    h+=`</div>`;
  });
  h+=`<div class="sec-title">Cópia de segurança</div><div class="card"><div class="small muted" style="margin-bottom:10px">${esc(syncLabel)}</div><div class="row"><button class="btn grow" data-act="export">Exportar</button><button class="btn grow" data-act="import">Importar</button></div></div>`;
  return h;
}

  wDelSet:el=>{ const it=S.current.items[+el.dataset.i]; if(it.sets.length>1) it.sets.pop(); saveState(); const y=scrollY; render(); scrollTo(0,y); },
  wRemoveEx:el=>{ const i=+el.dataset.i, it=S.current.items[i]; if(!confirm(`Remover ${EXM[it.ex]?EXM[it.ex].n:'exercício'} deste treino?`)) return; S.current.items.splice(i,1); if((S.current.idx||0)>=S.current.items.length) S.current.idx=Math.max(0,S.current.items.length-1); saveState(); closeSheet(); render(); },
  wAddEx:()=>{ closeSheet(); openPicker('Adicionar ao treino',id=>{ S.current.items.push(newItem(id,3,EXM[id].tm?'30 s':'10–12')); S.current.idx=S.current.items.length-1; UI.wOpen=null; saveState(); closeSheet(); render(); scrollTo(0,0); toast('Exercício adicionado'); }); },
  wFinish:()=>{
    const c=S.current;
    const items=c.items.map(i=>({ex:i.ex,sets:i.sets.filter(x=>x.done||String(x.r).trim()!=='').map(x=>({w:x.w,r:x.r}))})).filter(i=>i.sets.length);
    if(!items.length){ toast('Marca pelo menos uma série como feita'); return; }
    const s={id:c.id,date:new Date(c.start).toISOString(),dur:Math.max(1,Math.round((Date.now()-c.start)/60000)),planId:c.planId,planName:c.planName,dayName:c.dayName,items};
    SESS.unshift(s); sortSess(); saveSession(s); S.current=null; saveState(); stopRest(); UI.screen='home'; try{history.replaceState({s:'home'},'')}catch(e){} closeSheet(); render(); window.scrollTo(0,0); toast('Treino guardado. Bom trabalho!');
  },
  wDiscard:()=>{ if(!confirm('Descartar este treino? O que registaste não fica guardado.')) return; S.current=null; saveState(); stopRest(); closeSheet(); UI.screen='home'; try{history.replaceState({s:'home'},'')}catch(e){} render(); },
  restAdd:()=>{ restEnd+=15000; restTotal+=15; drawRest(); },
  restSkip:()=>stopRest(),
  openPlan:el=>navigate('planos',{plan:el.dataset.id}),
  newPlan:()=>{ const p={id:uid('p'),name:'Novo plano',desc:'',days:[{name:'Treino A',items:[]}]}; S.plans.push(p); saveState(); navigate('planos',{plan:p.id}); },
  restoreTpl:()=>{ let n=0; TPL.forEach(t=>{ if(!S.plans.find(p=>p.tpl===t.tpl)){ S.plans.push({...clone(t),id:uid('p')}); n++; } }); saveState(); render(); toast(n?`${n} planos repostos`:'Os planos sugeridos já estão na lista'); },
  addDay:()=>{ const p=curPlan(); p.days.push({name:'Treino '+String.fromCharCode(65+p.days.length),items:[]}); saveState(); render(); },
  delDay:el=>{ const p=curPlan(); if(p.days.length<=1){ toast('O plano precisa de pelo menos um treino'); return; } if(!confirm(`Apagar "${p.days[+el.dataset.d].name}"?`)) return; p.days.splice(+el.dataset.d,1); saveState(); render(); },
  delItem:el=>{ const p=curPlan(); p.days[+el.dataset.d].items.splice(+el.dataset.ii,1); saveState(); const y=scrollY; render(); scrollTo(0,y); },
  planAddEx:el=>{ const di=+el.dataset.d; openPicker('Adicionar ao plano',id=>{ const p=curPlan(); p.days[di].items.push(it(id,3,EXM[id].tm?'30 s':'10–12')); saveState(); closeSheet(); const y=scrollY; render(); scrollTo(0,y); toast('Exercício adicionado'); }); },
  dupPlan:()=>{ const p=clone(curPlan()); p.id=uid('p'); p.name+=' (cópia)'; delete p.tpl; S.plans.push(p); saveState(); navigate('planos',{plan:p.id}); },
  delPlan:()=>{ const p=curPlan(); if(S.plans.length<=1){ toast('Precisas de ter pelo menos um plano'); return; } if(!confirm(`Apagar o plano "${p.name}"?`)) return; S.plans=S.plans.filter(x=>x.id!==p.id); if(S.activePlan===p.id) S.activePlan=S.plans[0].id; saveState(); goBack(); },
  addToPlan:el=>{
    const exId=el.dataset.ex;
    const opts=S.plans.map(p=>p.days.map((d,di)=>`<button class="recipe" data-act="addToPlanGo" data-ex="${exId}" data-p="${p.id}" data-d="${di}"><span class="grow"><span class="h3" style="display:block">${esc(d.name)}</span><span class="small muted">${esc(p.name)}</span></span><span class="link">Adicionar</span></button>`).join('')).join('');
    openSheet(`<div class="sh-top"><h2>Adicionar a que treino?</h2><button class="iconbtn" data-act="closeSheet" aria-label="Fechar">×</button></div>${opts}`);
  },
  addToPlanGo:el=>{ const p=S.plans.find(x=>x.id===el.dataset.p); if(!p) return; const ex=EXM[el.dataset.ex]; p.days[+el.dataset.d].items.push(it(ex.id,3,ex.tm?'30 s':'10–12')); saveState(); closeSheet(); render(); toast(`Adicionado a ${p.days[+el.dataset.d].name}`); },
  exPlace:el=>{ UI.exPlace=el.dataset.k; render(); },
  exZone:el=>{ UI.exZone=el.dataset.k; render(); },
  pkPlace:el=>{ UI.pick.place=el.dataset.k; refreshPicker(true); },
  pkZone:el=>{ UI.pick.zone=el.dataset.k; refreshPicker(true); },
  pickEx:el=>{ const cb=UI.pick&&UI.pick.onPick; if(cb) cb(el.dataset.ex); },
  foodTab:el=>{ UI.foodTab=el.dataset.k; render(); },
  foodPrev:()=>{ const [y,m,d]=UI.foodDate.split('-').map(Number); UI.foodDate=dkey(new Date(y,m-1,d-1)); render(); },
  foodNext:()=>{ const [y,m,d]=UI.foodDate.split('-').map(Number); const n=dkey(new Date(y,m-1,d+1)); if(n<=dkey()){ UI.foodDate=n; render(); } },
  water:el=>{ const d=dayFood(UI.foodDate); d.water=Math.max(0,(d.water||0)+(+el.dataset.v)); saveState(); render(); },
  foodAdd:el=>openAdd(el.dataset.slot),
  quickLog:()=>{ const hr=new Date().getHours(), m=new Date().getMinutes(); const sl=hr<10||(hr===10&&m<30)?'Pequeno-almoço':hr<15?'Almoço':hr<19?'Lanche':'Jantar'; UI.foodTab='hoje'; UI.foodDate=dkey(); navigate('comida'); openAdd(sl); },
  addSlot:el=>{ UI.add.slot=el.dataset.k; document.querySelectorAll('[data-act="addSlot"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===UI.add.slot)); },
  addTab:el=>{ UI.add.tab=el.dataset.k; document.querySelectorAll('[data-act="addTab"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===UI.add.tab)); renderAddBody(); },
  plateAdd:el=>{ const f=foodById(el.dataset.f); if(!f) return; UI.add.plate.items.push({fid:f.id,q:f.por.length?1:100,u:f.por.length?'0':'g'}); S.recentFoods=[f.id,...S.recentFoods.filter(x=>x!==f.id)].slice(0,12); UI.add.q=''; const s=document.getElementById('fq'); if(s) s.value=''; renderFoodResults(); renderPlate(); toast(`${f.n.split(' (')[0]} adicionado ao prato`); },
  plateDel:el=>{ UI.add.plate.items.splice(+el.dataset.k,1); renderPlate(); },
  plateLog:()=>{
    const pl=UI.add.plate; if(!pl.items.length){ toast('Adiciona pelo menos um alimento'); return; }
    const t=plateTotals(pl.items); const nm=(document.getElementById('plName')||{}).value||''; const save=(document.getElementById('plSave')||{}).checked;
    const name=nm.trim()||t.parts.map(p=>p.n.split(' (')[0]).join(' + ');
    dayFood(UI.foodDate).items.push({slot:UI.add.slot,rid:null,name,kcal:Math.round(t.k),prot:Math.round(t.p),carb:Math.round(t.c),fat:Math.round(t.f),parts:t.parts});
    if(save){ const ex=pl.editId&&S.myPlates.find(x=>x.id===pl.editId); if(ex){ ex.name=name; ex.items=clone(pl.items);} else S.myPlates.unshift({id:uid('pl'),name,items:clone(pl.items)}); }
    saveState(); closeSheet(); render(); toast(`Registado: ${Math.round(t.k)} kcal, ${Math.round(t.p)} g proteína`);
  },
  plateLogSaved:el=>{ const pl=S.myPlates.find(x=>x.id===el.dataset.id); if(!pl) return; const t=plateTotals(pl.items); dayFood(UI.foodDate).items.push({slot:UI.add.slot,rid:null,name:pl.name,kcal:Math.round(t.k),prot:Math.round(t.p),carb:Math.round(t.c),fat:Math.round(t.f),parts:t.parts}); saveState(); closeSheet(); render(); toast(`Registado em ${UI.add.slot}`); },
  plateEdit:el=>{ const pl=S.myPlates.find(x=>x.id===el.dataset.id); if(!pl) return; UI.add.plate={items:clone(pl.items),name:pl.name,editId:pl.id}; UI.add.tab='prato'; document.querySelectorAll('[data-act="addTab"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k==='prato')); renderAddBody(); },
  plateDelSaved:el=>{ if(!confirm('Apagar este prato guardado?')) return; S.myPlates=S.myPlates.filter(x=>x.id!==el.dataset.id); saveState(); renderAddBody(); },
  newFood:()=>{
    const g=id=>(document.getElementById(id)||{}).value||'';
    const n=g('nfN').trim(), k=num(g('nfK')); if(!n||k==null){ toast('Põe pelo menos o nome e as kcal'); return; }
    const pg=num(g('nfPG')); const f={id:uid('m'),n,k,p:num(g('nfP'))||0,c:num(g('nfC'))||0,f:num(g('nfF'))||0,cat:'Os meus alimentos',por:pg?[{l:g('nfPL').trim()||'1 porção',g:pg}]:[]};
    S.myFoods.push(f); saveState(); UI.add.tab='prato'; UI.add.plate.items.push({fid:f.id,q:f.por.length?1:100,u:f.por.length?'0':'g'});
    document.querySelectorAll('[data-act="addTab"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k==='prato')); renderAddBody(); toast('Alimento criado e adicionado ao prato');
  },
  foodPick:el=>{ const r=RM[el.dataset.id]; dayFood(UI.foodDate).items.push({slot:UI.add?UI.add.slot:el.dataset.slot,rid:r.id,name:r.n,kcal:r.kcal,prot:r.prot}); saveState(); closeSheet(); render(); },
  foodFree:el=>{ const n=document.getElementById('fn').value.trim(); if(!n){ document.getElementById('fn').focus(); return; } dayFood(UI.foodDate).items.push({slot:UI.add?UI.add.slot:el.dataset.slot,rid:null,name:n,kcal:num(document.getElementById('fk').value)||0,prot:num(document.getElementById('fp').value)||0}); saveState(); closeSheet(); render(); },
  foodDel:el=>{ dayFood(UI.foodDate).items.splice(+el.dataset.i,1); saveState(); render(); },
  recipe:el=>recipeSheet(el.dataset.id),
  logRecipe:el=>{ const r=RM[el.dataset.id]; dayFood(dkey()).items.push({slot:el.dataset.slot,rid:r.id,name:r.n,kcal:r.kcal,prot:r.prot}); saveState(); closeSheet(); toast(`Registado em ${el.dataset.slot}`); render(); },
  shopQty:el=>{ const id=el.dataset.id; const n=Math.max(0,(S.shop.sel[id]||0)+(+el.dataset.v)); if(n) S.shop.sel[id]=n; else delete S.shop.sel[id]; saveState(); const s=document.getElementById('shopN'); if(s) s.textContent=n; render(); },
  shopClearGot:()=>{ S.shop.got={}; saveState(); render(); },
  shopClear:()=>{ if(!confirm('Esvaziar a lista de compras?')) return; S.shop={sel:{},got:{}}; saveState(); render(); },
  toggleSess:el=>{ UI.openSess=UI.openSess===el.dataset.id?null:el.dataset.id; const y=scrollY; render(); scrollTo(0,y); },
  delSess:el=>{ if(!confirm('Apagar este treino do histórico?')) return; deleteSession(el.dataset.id); render(); toast('Treino apagado'); },
  export:async()=>{
    const data=JSON.stringify({app:'treino-casa',v:1,exported:new Date().toISOString(),state:S,sessions:SESS},null,1);
    const fname=`treino-backup-${dkey()}.json`;
    try{ const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null; if(dl){ await dl.save({filename:fname,data}); return; } }catch(e){ if(e&&e.code==='declined') return; }
    if(!(window.claude&&window.claude.use)){ try{ const blob=new Blob([data],{type:'application/json'}); const u=URL.createObjectURL(blob); const lk=document.createElement('a'); lk.href=u; lk.download=fname; document.body.appendChild(lk); lk.click(); lk.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); toast('Cópia descarregada'); return; }catch(e){} }
    openSheet(`<div class="sh-top"><h2>Exportar</h2><button class="iconbtn" data-act="closeSheet" aria-label="Fechar">×</button></div><p class="muted small">Copia este texto e guarda-o numa nota ou ficheiro. Para recuperar, usa Importar.</p><textarea class="input" style="min-height:220px;font-size:12px" readonly id="expTxt">${esc(data)}</textarea><button class="btn primary block" style="margin-top:10px" data-act="copyExp">Copiar</button>`);
  },
  copyExp:async()=>{ const t=document.getElementById('expTxt'); try{ await navigator.clipboard.writeText(t.value); toast('Copiado'); }catch(e){ t.select(); document.execCommand&&document.execCommand('copy'); toast('Copiado'); } },
  import:()=>document.getElementById('importFile').click()
};

/* ======================= EVENTS ======================= */
document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el) return; const f=ACT[el.dataset.act]; if(f){ e.preventDefault(); f(el,e); } });
let inT=null;
document.addEventListener('input',e=>{
  const el=e.target, k=el.dataset&&el.dataset.in; if(!k) return;
  if(k==='w'||k==='r'){ const st=S.current&&S.current.items[+el.dataset.i]&&S.current.items[+el.dataset.i].sets[+el.dataset.j]; if(st){ st[k]=el.value; clearTimeout(inT); inT=setTimeout(saveState,500);} return; }
  if(k==='exQ'){ UI.exQ=el.value; refreshExList(); return; }
  if(k==='fq'){ if(UI.add){ UI.add.q=el.value; renderFoodResults(); } return; }
  if(k==='pq'){ if(UI.add){ UI.add.plate.items[+el.dataset.k].q=el.value.replace(',','.'); updatePlateNums(); } return; }
  if(k==='pkQ'){ if(UI.pick){ UI.pick.q=el.value; refreshPicker(); } return; }
  const p=curPlan();
  if(p){
    if(k==='planName') p.name=el.value;
    else if(k==='planDesc') p.desc=el.value;
    else if(k==='dayName') p.days[+el.dataset.d].name=el.value;
    else if(k==='itSets'){ const n=parseInt(el.value,10); if(n>0&&n<20) p.days[+el.dataset.d].items[+el.dataset.ii].sets=n; }
    else if(k==='itReps') p.days[+el.dataset.d].items[+el.dataset.ii].reps=el.value;
    clearTimeout(inT); inT=setTimeout(saveState,600);
  }
});
document.addEventListener('change',e=>{
  const el=e.target, k=el.dataset&&el.dataset.in;
  if(k==='progEx'){ UI.progEx=el.value; render(); }
  if(k==='pu'&&UI.add){ const it=UI.add.plate.items[+el.dataset.k], f=foodById(it.fid); const g=itemGrams(it,f); it.u=el.value; it.q=el.value==='g'?Math.round(g):Math.max(1,Math.round(g/f.por[+el.value].g*2)/2); renderPlate(); }
  if(k==='shopGot'){ const key=el.dataset.key; if(el.checked) S.shop.got[key]=1; else delete S.shop.got[key]; saveState(); el.closest('.shop-it').classList.toggle('got',el.checked); }
});
document.getElementById('importFile').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const o=JSON.parse(await f.text());
    if(!o||!o.state||!Array.isArray(o.sessions)) throw new Error('formato');
    if(!confirm(`Importar a cópia de ${o.exported?fmtDate(o.exported):'data desconhecida'}? Substitui os dados atuais.`)) return;
    S=normalize(o.state); SESS=o.sessions.filter(s=>s&&s.id); sortSess(); S.deleted=[];
    saveState(); lsSet(LS_SESS,SESS); SESS.forEach(s=>{ if(remote) q(()=>sessCol().doc(s.id).set({date:s.date,json:JSON.stringify(s)})); });
    render(); toast('Cópia importada');
  }catch(err){ toast('Este ficheiro não é uma cópia válida da app'); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });

try{ history.replaceState({s:'home'},''); }catch(e){}
render();
initRemote();
</script>
</body>
